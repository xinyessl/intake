  // ---------- 草稿本地暂存（AC-23：刷新不丢当前会话）----------
  // 用 sessionStorage（当前标签会话内存活、刷新即恢复；FS-01 A5 禁用长效端存储，故不用它，避免存登录态/密码残留）。
  var DRAFT_KEY = 'intake_field_draft_v1';
  function saveDraft() {
    try {
      var input = $('fChatInput');
      var d = { kind: chat.submitKind, messages: chat.messages, savedId: chat.savedId, convId: chat.convId, reopenProject: chat.reopenProject || '', reopenSubsystem: chat.reopenSubsystem || '', reopenIntakeProject: chat.reopenIntakeProject || '', deep: !!chat.deep, input: input ? input.value : '', user: (state.me && (state.me.username || state.me.name)) || '' };
      sessionStorage.setItem(DRAFT_KEY, JSON.stringify(d));
    } catch (e) {}
  }
  function clearDraft() { try { sessionStorage.removeItem(DRAFT_KEY); } catch (e) {} }
  function restoreDraft() {
    try {
      var raw = sessionStorage.getItem(DRAFT_KEY); if (!raw) return;
      var d = JSON.parse(raw); if (!d) return;
      // 换了登录用户 → 丢弃旧草稿（避免串号）
      if (d.user && state.me && (state.me.username || state.me.name) && d.user !== (state.me.username || state.me.name)) { clearDraft(); return; }
      chat.deep = !!d.deep;   // 先恢复深入思考设置，再 setSubmitKind（内部 syncDeep 会据此点亮开关）
      setSubmitKind(d.kind || 'intake');
      chat.savedId = d.savedId || ''; chat.convId = d.convId || ''; chat.reopenProject = d.reopenProject || ''; chat.reopenSubsystem = d.reopenSubsystem || ''; chat.reopenIntakeProject = d.reopenIntakeProject || '';
      syncDeep();   // 刷新开关显隐/高亮（草稿 kind + deep 都恢复后）
      if (Array.isArray(d.messages) && d.messages.length) {
        chat.messages = d.messages.slice();
        // 重放气泡（含已建单则显示已归档提示；不重复调后端，纯还原视图）
        clearPlaceholder();
        chat.messages.forEach(function (m) { appendBubble(m.role === 'user' ? 'me' : 'ai', m.content); });
        if (chat.savedId) appendArchiveCard({ id: chat.savedId, type: '', site: '', subsystem: '', version: '' });
      }
      var input = $('fChatInput'); if (input && d.input) input.value = d.input;
    } catch (e) {}
  }

  // ---------- 受控 Markdown（块级 + 行内 · 零依赖 · XSS 安全） ----------
  // 事实源口径：先整体转义 & < >（转义在前、再套 markdown，杜绝脚本注入），
  // 再按行判块（标题 # / 无序 -*+ / 有序 1. / 空行 / 段落），块内跑行内规则（**加粗** / `代码`）。
  function md(src) {
    var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); };
    // 行内规则：在已转义文本上跑（不跨行）——`代码` 与 **加粗**
    var inline = function (s) {
      s = s.replace(/`([^`]+)`/g, function (m, c) { return '<code>' + c + '</code>'; });
      s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      return s;
    };
    var lines = esc(src).split('\n');
    var out = [];       // 已闭合的块 HTML 片段
    var para = [];      // 当前累积的普通段落行（用 <br> 连内部换行）
    var listType = '';  // 当前开着的列表：'ul' | 'ol' | ''
    var listItems = []; // 当前列表的 <li> 内容
    var flushPara = function () {
      if (para.length) { out.push('<p class="md-p">' + para.join('<br>') + '</p>'); para = []; }
    };
    var flushList = function () {
      if (listType) {
        out.push('<' + listType + ' class="md-' + listType + '">' +
          listItems.map(function (it) { return '<li class="md-li">' + it + '</li>'; }).join('') +
          '</' + listType + '>');
        listType = ''; listItems = [];
      }
    };
    for (var i = 0; i < lines.length; i++) {
      var ln = lines[i];
      var mH = ln.match(/^(#{1,6})\s+(.*)$/);       // 标题 # ~ ######
      var mUl = ln.match(/^\s*[-*+]\s+(.*)$/);        // 无序列表 - * +
      var mOl = ln.match(/^\s*\d+\.\s+(.*)$/);        // 有序列表 1. 2. ...
      if (mH) {
        flushPara(); flushList();
        var lvl = mH[1].length;
        out.push('<div class="md-h md-h' + lvl + '">' + inline(mH[2]) + '</div>');
      } else if (mUl) {
        flushPara();
        if (listType !== 'ul') { flushList(); listType = 'ul'; }
        listItems.push(inline(mUl[1]));
      } else if (mOl) {
        flushPara();
        if (listType !== 'ol') { flushList(); listType = 'ol'; }
        listItems.push(inline(mOl[1]));
      } else if (ln.trim() === '') {
        // 空行 = 段落/块分隔：闭合当前段落与列表（间距交给块元素 margin，不堆叠空 <br>）
        flushPara(); flushList();
      } else {
        flushList();
        para.push(inline(ln));
      }
    }
    flushPara(); flushList();
    return out.join('');
  }

  // ---------- 经验库检索面板（FS-07 · AC-1/2/3/4/6/7） ----------
  var SRC_LABEL = { manual: '人工', consult: '答疑', auto: '自动' };
  function srcKind(from) { return from === 'manual' ? 'manual' : from === 'consult' ? 'consult' : 'auto'; }

  function openKb() {
    $('fKbMask').classList.add('open');
    $('fKbDrawer').classList.add('open');
    $('fKbDrawer').setAttribute('aria-hidden', 'false');
    setTimeout(function () { $('fKbInput').focus(); }, 60);
    kbBrowseAll();   // 打开即浏览全库（非空态 hollow）；输入关键词回车/点搜索 → 走精确检索覆盖
  }

  // 浏览全库所有条目（all=1）：打开经验库时展示全部，供直接翻阅；真的一条都没有 → 「经验库暂无内容」
  function kbBrowseAll() {
    var results = $('fKbResults'), hollow = $('fKbHollow');
    hollow.style.display = 'block'; hollow.textContent = '加载中…'; results.innerHTML = '';
    api('/api/kb-search?all=1', { method: 'GET' }).then(function (r) {
      var entries = (r.body && Array.isArray(r.body.entries)) ? r.body.entries : [];
      if (!entries.length) { results.innerHTML = ''; hollow.style.display = 'block'; hollow.textContent = '经验库暂无内容'; return; }
      hollow.style.display = 'none';
      results.innerHTML = '';
      entries.forEach(function (e) { results.appendChild(mkKbItem(e)); });
    }).catch(function () { results.innerHTML = ''; hollow.style.display = 'block'; hollow.textContent = '加载失败，请重试'; });
  }
  function closeKb() {
    $('fKbMask').classList.remove('open');
    $('fKbDrawer').classList.remove('open');
    $('fKbDrawer').setAttribute('aria-hidden', 'true');
  }

  // AC-2：回车或点按钮触发（自由文本框不即输即查，对齐全局规范 #11）；不传 project = 全库所有产品
  function doKbSearch() {
    var q = $('fKbInput').value.trim();
    var results = $('fKbResults');
    var hollow = $('fKbHollow');
    if (!q) { kbBrowseAll(); return; }   // 清空关键词 → 回到浏览全部（覆盖上次检索结果）
    hollow.style.display = 'block'; hollow.textContent = '检索中…'; results.innerHTML = '';
    api('/api/kb-search?q=' + encodeURIComponent(q), { method: 'GET' })
      .then(function (r) {
        var entries = (r.body && Array.isArray(r.body.entries)) ? r.body.entries : [];
        renderKbResults(entries);
      })
      .catch(function () { results.innerHTML = ''; hollow.style.display = 'block'; hollow.textContent = '检索失败，请重试'; });
  }

  // AC-3：每条显示 所属产品 + 问题 q + 子系统 + 来源徽标；AC-6：空态引导
  function renderKbResults(entries) {
    var results = $('fKbResults');
    var hollow = $('fKbHollow');
    if (!entries.length) {
      results.innerHTML = '';
      hollow.style.display = 'none';
      // AC-6 空态：未找到相关经验 + 「去 AI 对话提交」入口（FS-04 尚未建 → 占位禁用）
      var empty = document.createElement('div');
      empty.className = 'f-kb-empty';
      empty.innerHTML =
        '<i class="ti ti-mood-empty"></i>' +
        '<div class="t">未找到相关经验</div>' +
        '<div class="d">可去 AI 对话提交，让运营帮你处理</div>';
      // TODO(FS-04): AI 对话提交页/接口尚未建；此入口先做禁用占位，别臆造 FS-04 的页面/接口
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn btn-primary';
      btn.disabled = true;
      btn.title = 'AI 对话提交（FS-04）即将上线';
      btn.innerHTML = '<i class="ti ti-message-chatbot"></i> 去 AI 对话提交';
      empty.appendChild(btn);
      results.appendChild(empty);
      return;
    }
    hollow.style.display = 'none';
    results.innerHTML = '';
    entries.forEach(function (e) { results.appendChild(mkKbItem(e)); });
  }

  function mkKbItem(e) {
    var item = document.createElement('div');
    item.className = 'f-kb-item';
    var prod = e.productName || e.project || '—';
    var subDisp = e.subsystemLabel || e.subsystem || '';   // 显示用：服务端解析的子系统中文 desc 优先，回退英文 name（子系统显中文，2026-07-23）
    var subCell = subDisp ? escapeHtml(subDisp) : '—';
    var kind = srcKind(e.from);
    var srcTxt = SRC_LABEL[kind] || '自动';
    var meta =
      '<span class="f-kb-prod"><i class="ti ti-package"></i>' + escapeHtml(prod) + '</span>' +
      '<span class="f-kb-src src-' + kind + '">' + srcTxt + '</span>' +
      '<span class="f-kb-sub">子系统：' + subCell + '</span>';
    var hd = document.createElement('div');
    hd.className = 'f-kb-hd';
    hd.innerHTML =
      '<div class="f-kb-meta">' + meta + '</div>' +
      '<div class="f-kb-q"><i class="ti ti-chevron-right chev"></i><span>' + escapeHtml(e.q || '') + '</span></div>';
    var body = document.createElement('div');
    body.className = 'f-kb-body';
    // AC-4：展开显示完整解法 a，受控 Markdown（先转义再解析，防 XSS）
    body.innerHTML = '<div class="f-kb-answer">' + md(e.a || '') + '</div>';
    // AC-4：点击标题展开/收起
    hd.addEventListener('click', function () { item.classList.toggle('open'); });
    item.appendChild(hd);
    item.appendChild(body);
    return item;
  }

  // ---------- 绑定事件 ----------
  function bind() {
    $('loginBtn').addEventListener('click', doLogin);
    $('loginPwd').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
    $('loginUser').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('loginPwd').focus(); });
    var pwEye = $('loginPwdEye');
    if (pwEye) pwEye.addEventListener('click', function () {
      var pwd = $('loginPwd'); var reveal = pwd.type === 'password';
      pwd.type = reveal ? 'text' : 'password';
      pwEye.innerHTML = reveal ? '<i class="ti ti-eye-off"></i>' : '<i class="ti ti-eye"></i>';
      pwEye.setAttribute('aria-label', reveal ? '隐藏密码' : '显示密码');
      pwd.focus();
    });

    // 维度下拉
    $('fModeCur').addEventListener('click', function (e) {
      e.stopPropagation();
      var open = $('fMode').classList.contains('open');
      closeAllMenus();
      if (!open) $('fMode').classList.add('open');
    });
    var modeItems = $('fModeMenu').querySelectorAll('.f-mode-item');
    for (var k = 0; k < modeItems.length; k++) {
      modeItems[k].addEventListener('click', function (e) {
        e.stopPropagation();
        setMode(this.getAttribute('data-m'));
        $('fMode').classList.remove('open');
      });
    }

    // 待办 popover
    $('fTodoBtn').addEventListener('click', function (e) {
      e.stopPropagation();
      var open = $('fTodoPop').classList.contains('open');
      closeAllMenus();
      if (!open) $('fTodoPop').classList.add('open');
    });

    // 用户菜单
    $('fUserTrigger').addEventListener('click', function (e) {
      e.stopPropagation();
      var open = $('fUserMenu').classList.contains('open');
      closeAllMenus();
      if (!open) $('fUserMenu').classList.add('open');
    });
    $('fLogoutBtn').addEventListener('click', function (e) { e.stopPropagation(); doLogout(); });

    // FS-02 提交清单：按批次/按类型 tab（选择即刷新，即选即查）
    var tabs2 = $('fTabs2').querySelectorAll('.f-tab2');
    for (var t = 0; t < tabs2.length; t++) {
      tabs2[t].addEventListener('click', function () { setGroupBy(this.getAttribute('data-g')); });
    }
    // FS-02 子项目下拉触发器
    $('fProdCur').addEventListener('click', function (e) {
      e.stopPropagation();
      var open = $('fProdWrap').classList.contains('open');
      closeAllMenus();
      if (!open) $('fProdWrap').classList.add('open');
    });

    // 经验库入口（FS-07 检索面板；抽屉自实现 open/close）
    $('fKbBtn').addEventListener('click', function (e) { e.stopPropagation(); closeAllMenus(); openKb(); });
    $('fKbClose').addEventListener('click', closeKb);
    $('fKbMask').addEventListener('click', closeKb);
    $('fKbSearchBtn').addEventListener('click', doKbSearch);
    // AC-2：自由文本框回车触发（不即输即查）
    $('fKbInput').addEventListener('keydown', function (ev) { if (ev.key === 'Enter') doKbSearch(); });

    // Esc 关闭面板
    document.addEventListener('keydown', function (ev) {
      if (ev.key !== 'Escape') return;
      if ($('fKbDrawer').classList.contains('open')) { closeKb(); return; }
      var vd = $('fVerDetail');   // 版本明细面板：Esc 关闭
      if (vd && (state.verDetailOpen || vd.classList.contains('open'))) { closeAllMenus(); return; }
      var sd = $('fSysDD');   // FS-03 系统视图下拉：Esc 关闭
      if (sd && (state.sysOpen || sd.classList.contains('open'))) { closeAllMenus(); return; }
      var hd = $('fHospDD');  // FS-02 医院视图下拉：Esc 关闭
      if (hd && (state.hospOpen || hd.classList.contains('open'))) closeAllMenus();
    });

    // ---------- FS-04 · AI 对话区 ----------
    // 提交类型切换（提需求/报BUG ↔ 咨询答疑）
    var togBtns = $('fToggle').querySelectorAll('button');
    for (var tg = 0; tg < togBtns.length; tg++) {
      togBtns[tg].addEventListener('click', function () {
        var k = this.getAttribute('data-k');
        if (k === chat.submitKind) return;                 // 点当前模式：不动
        var hasConv = chat.messages && chat.messages.length;
        setSubmitKind(k);
        if (hasConv) newConversation();                    // 切到不同模式且已有对话 → 起新对话（咨询↔提单是不同上下文）
      });
    }
    // 深入思考开关（仅咨询答疑显示；开→sendConsult 带 deep:true）
    var deepBtn = $('fDeep'); if (deepBtn) deepBtn.addEventListener('click', toggleDeep);
    // 新对话
    $('fNewC').addEventListener('click', function () { newConversation(); });
    // 发送：点按钮 + 回车（AC-9/17：自然语言输入回车发送）
    $('fChatSend').addEventListener('click', sendChat);
    $('fChatInput').addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendChat(); } });
    // 未发送内容随输入暂存（AC-23：刷新恢复当前输入）
    $('fChatInput').addEventListener('input', saveDraft);
    // 截图附件：点图片按钮 → 打开文件选择器；选中即读入 pendingImages（≤6，压缩后预览）
    var imgBtn = $('fImgBtn'), imgInput = $('fImgInput');
    if (imgBtn && imgInput) {
      imgBtn.addEventListener('click', function () { imgInput.click(); });
      imgInput.addEventListener('change', function () { addImageFiles(imgInput.files); imgInput.value = ''; });   // 清空 value 以便同一张能再次选
    }
    // 粘贴取图（报错截图常直接 Ctrl+V 贴进输入框）：取 clipboardData 里的图片项
    $('fChatInput').addEventListener('paste', function (e) {
      var items = (e.clipboardData && e.clipboardData.items) || [];
      var files = [];
      for (var i = 0; i < items.length; i++) { if (items[i].kind === 'file' && /^image\//.test(items[i].type)) { var f = items[i].getAsFile(); if (f) files.push(f); } }
      if (files.length) { e.preventDefault(); addImageFiles(files); }   // 有图片 → 拦截默认粘贴、加入待发送
    });

    // 点空白关菜单
    document.addEventListener('click', function () { closeAllMenus(); });
  }

  // ---------- 启动 ----------
  bind();
  restore();

  // 左右面板可拖拽调整宽度（splitter；宽度存 sessionStorage 会话级，避页面禁用的持久存储静态断言）
  (function initSplitter(){
    var sp=document.getElementById('fSplitter'), pane=document.getElementById('fSubmitPane'), ws=document.getElementById('fWorkspace');
    if(!sp||!pane||!ws) return;
    try{ var saved=sessionStorage.getItem('fieldPaneW'); if(saved){ pane.style.flex='0 0 '+saved+'px'; pane.style.maxWidth='none'; } }catch(e){}
    var dragging=false;
    sp.addEventListener('mousedown', function(e){ dragging=true; sp.classList.add('dragging'); document.body.style.cursor='col-resize'; document.body.style.userSelect='none'; e.preventDefault(); });
    window.addEventListener('mousemove', function(e){ if(!dragging) return; var r=ws.getBoundingClientRect(); var w=e.clientX-r.left; var min=280, max=Math.max(min, r.width-360); w=Math.max(min, Math.min(max, w)); pane.style.flex='0 0 '+w+'px'; pane.style.maxWidth='none'; });
    window.addEventListener('mouseup', function(){ if(!dragging) return; dragging=false; sp.classList.remove('dragging'); document.body.style.cursor=''; document.body.style.userSelect=''; try{ var b=parseInt(pane.style.flexBasis||pane.getBoundingClientRect().width,10); if(b) sessionStorage.setItem('fieldPaneW', b); }catch(e){} });
  })();

  // 暴露给测试/调试（不含敏感数据）
  window.__field = { setMode: setMode, doLogin: doLogin, doLogout: doLogout, getState: function () { return state; }, openKb: openKb, closeKb: closeKb, doKbSearch: doKbSearch, kbBrowseAll: kbBrowseAll, md: md, setGroupBy: setGroupBy, selectSub: selectSub, subLabel: subLabel, onHospitalChange: onHospitalChange, buildSubOptions: buildSubOptions, fmtTime: fmtTime, renderTypeView: renderTypeView, mkItem: mkItem, reopenConsult: reopenConsult, reopenIntake: reopenIntake, onSystemTab: onSystemTab, loadSystemView: loadSystemView, renderSystemView: renderSystemView, updateCtx: updateCtx, productOfSystem: productOfSystem, setSubmitKind: setSubmitKind, newConversation: newConversation, sendChat: sendChat, currentArchive: currentArchive, getChat: function () { return chat; }, loadBatchView: loadBatchView, renderBatchView: renderBatchView, mkBatchGroup: mkBatchGroup, mkPkgCard: mkPkgCard, mkBatchItem: mkBatchItem, showToast: showToast, openMaintainEdit: openMaintainEdit, doMaintainSave: doMaintainSave, maintainChipHtml: maintainChipHtml, maintainDaysLeft: maintainDaysLeft, renderTodoBody: renderTodoBody, mkUpdatePlanBlock: mkUpdatePlanBlock, loadUpdatePlan: loadUpdatePlan, renderUpdatePlan: renderUpdatePlan, mkPlanTaskItem: mkPlanTaskItem, mkSqlBundleItem: mkSqlBundleItem, doTaskToggle: doTaskToggle, doSqlBundleToggle: doSqlBundleToggle };
})();
</script>
