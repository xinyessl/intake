    });
  }

  // AC-7/8：选子系统即选即筛（无需点查询）；选「全部子项目」清除过滤。curSub 存英文 name（过滤键），标签显中文 desc。
  function selectSub(sub) {
    state.curSub = sub || '';
    setProdLabel(state.curSub ? subLabel(state.curSub) : '全部子项目');
    $('fProdWrap').classList.remove('open');
    renderProdDD();
    loadSubmissions();
    updateCtx();                   // 问题①：切子系统 → 归档条随所选子系统刷新（医院视图归档条显所选子系统中文名）
    syncConversationToSystem();   // FS-04：切子系统 → 保存旧段 + 恢复该系统会话
  }

  // AC-9/15：按批次/按类型切换（选择即刷新）。点「按批次」按钮就切过去、不回弹；批次未上线 → 空态提示（见 loadSubmissions 降级分支）
  function setGroupBy(g) {
    state.groupBy = (g === 'batch') ? 'batch' : 'type';
    var tabs = $('fTabs2').querySelectorAll('.f-tab2');
    for (var i = 0; i < tabs.length; i++) tabs[i].classList.toggle('on', tabs[i].getAttribute('data-g') === state.groupBy);
    loadSubmissions();
  }

  // 加载提交清单（服务端按 sites+projects 收敛，忽略越权传参；越权 hospitalId 后端裁掉）
  //   groupBy=type → /api/field/submissions（三桶）；groupBy=batch → /api/field/batches（FS-05 按批次视图·真实渲染）。
  function loadSubmissions() {
    if (state.mode !== 'hosp') return;
    var listType = $('fListType'), listBatch = $('fListBatch');
    // AC-4：无分配医院 → 空态占位，不发越权请求
    if (!state.curSite) {
      listBatch.style.display = 'none'; listType.style.display = 'block';
      listType.innerHTML = emptyHtml('ti-building-hospital', '暂无分配医院', '请联系运营端为你分配负责医院');
      return;
    }
    if (state.groupBy === 'batch') { loadBatchView(); return; }   // FS-05：按批次视图走独立数据源
    var qs = '?dimension=hosp&groupBy=type' +
      '&hospitalId=' + encodeURIComponent(state.curSite) +
      (state.curSub ? '&subsystem=' + encodeURIComponent(state.curSub) : '');
    listType.innerHTML = '<div class="f-list-empty"><div class="d">加载中…</div></div>';
    listBatch.style.display = 'none'; listType.style.display = 'block';
    api('/api/field/submissions' + qs, { method: 'GET' }).then(function (r) {
      var b = r.body || {};
      renderTypeView(b.groups || []);
    }).catch(function () {
      listType.innerHTML = emptyHtml('ti-alert-triangle', '加载失败', '请稍后重试');
    });
  }

  // ========== FS-05 · 按批次视图（替换旧降级占位）：下载 / 一键改版本 / 逐单验证 ==========
  //   数据源 /api/field/batches（当前账号相关批次 + 该账号 sites 范围内覆盖工单，服务端隔离）。
  //   仍无相关批次 → 友好空态（保留旧占位口径，别报错）。
  function loadBatchView() {
    var listType = $('fListType'), listBatch = $('fListBatch');
    listType.style.display = 'none'; listBatch.style.display = 'block';
    listBatch.innerHTML = '<div class="f-list-empty"><div class="d">加载中…</div></div>';
    var qs = state.curSite ? ('?hospitalId=' + encodeURIComponent(state.curSite)) : '';
    api('/api/field/batches' + qs, { method: 'GET' }).then(function (r) {
      var groups = (r.body && Array.isArray(r.body.groups)) ? r.body.groups : [];
      renderBatchView(groups);
    }).catch(function () {
      listBatch.innerHTML = emptyHtml('ti-alert-triangle', '加载失败', '请稍后重试');
    });
  }

  // 渲染按批次视图：每批一卡（批次号/产品/状态徽标/包版本）+（可下载）更新包卡 +（已下载）改版本条 + 组内逐单验证。
  function renderBatchView(groups) {
    var box = $('fListBatch');
    box.innerHTML = '';
    if (!groups.length) {
      // 无相关批次 → 保留友好空态（不报错，AC-H 兜底口径）
      box.innerHTML = emptyHtml('ti-calendar-stats', '暂无相关批次', '当前没有覆盖你负责医院的批次，运营端发布更新包后会出现在这里');
      return;
    }
    groups.forEach(function (g) { box.appendChild(mkBatchGroup(g)); });
  }

  var BATCH_TAG = { '开发中': 'tag-primary', '可下载': 'tag-info', '已交付': 'tag-success' };
  function mkBatchGroup(g) {
    var wrap = document.createElement('div');
    var expanded = state.batchExpanded[g.batchId] === true;   // 整个批次可折叠·默认收起（内存态·按 batchId）
    wrap.className = 'f-batch-grp' + (expanded ? ' open' : '');
    wrap.setAttribute('data-batch', g.batchId);
    var tag = BATCH_TAG[g.status] || 'tag-gray';
    var ticketCount = (g.subGroups || []).reduce(function (n, sg) { return n + ((sg.tickets || []).length); }, 0);
    var hd = document.createElement('div');
    hd.className = 'f-batch-hd';
    hd.innerHTML = '<i class="ti ti-chevron-down f-batch-chev"></i>' +
      '<span class="bname">' + escapeHtml(g.productName || g.product || '') + '</span>' +
      '<span class="bid">' + escapeHtml(g.batchId || '') + '</span>' +
      '<span class="tag ' + tag + '">' + escapeHtml(g.status || '') + '</span>' +
      (g.pkgVersion ? '<span class="bpkg">包版本 ' + escapeHtml(g.pkgVersion) + '</span>' : '') +
      (g.scheduleDate ? '<span class="bsched">计划交付 ' + escapeHtml(g.scheduleDate) + '</span>' : '<span class="bsched none">未排期</span>') +
      (ticketCount ? '<span class="bcount">' + ticketCount + ' 单</span>' : '');
    hd.addEventListener('click', function () { state.batchExpanded[g.batchId] = !(state.batchExpanded[g.batchId] === true); wrap.classList.toggle('open'); });
    wrap.appendChild(hd);
    var body = document.createElement('div');
    body.className = 'f-batch-body';
    // 更新包卡（可下载/已交付态且有包版本）
    if ((g.status === '可下载' || g.status === '已交付') && g.pkgVersion) body.appendChild(mkPkgCard(g));
    // 累积更新计划（按版本独立维护 + 跨版本累积）：有目标版本(pkgVersion)才异步拉取渲染
    if (g.pkgVersion) body.appendChild(mkUpdatePlanBlock(g));
    // 逐子系统分组 + 逐单
    (g.subGroups || []).forEach(function (sg) {
      var gh = document.createElement('div');
      gh.className = 'f-type-ghd';
      gh.innerHTML = '<span class="gname">' + escapeHtml(sg.subsystemLabel || sg.subsystem || '（未指定子系统）') + '</span>' +
        '<span class="gcount">' + (sg.tickets || []).length + '</span>';
      body.appendChild(gh);
      (sg.tickets || []).forEach(function (t) { body.appendChild(mkBatchItem(t, g)); });
    });
    wrap.appendChild(body);
    return wrap;
  }

  // 更新包卡：产品·包版本·发布时间·更新说明 + 「下载更新包」按钮（已下载 → .done「已下载」）
  function mkPkgCard(g) {
    var card = document.createElement('div');
    card.className = 'f-pkg-card';
    card.innerHTML = '<div class="pk-t"><i class="ti ti-package"></i> ' + escapeHtml(g.productName || g.product) + ' · 更新包 ' + escapeHtml(g.pkgVersion || '') + '</div>' +
      '<div class="pk-meta">发布时间：' + escapeHtml(fmtTime(g.releaseTime)) + '</div>' +
      (g.releaseNote ? '<div class="pk-note">' + escapeHtml(g.releaseNote) + '</div>' : '');
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'f-dl-btn';
    btn.innerHTML = g.downloadedByMe ? '<i class="ti ti-download"></i> 重新下载' : '<i class="ti ti-download"></i> 下载更新包';
    btn.addEventListener('click', function () { doBatchDownload(g, btn, card); });   // 总是可点 → 支持多次下载（更新包可重复下）
    card.appendChild(btn);
    // 已下载标识（不锁死按钮，仍可重新下载）
    if (g.downloadedByMe) {
      var dltag = document.createElement('span');
      dltag.style.cssText = 'display:inline-flex;align-items:center;gap:4px;margin-left:9px;color:#1E8E4E;font-size:12px;font-weight:600;vertical-align:middle';
      dltag.innerHTML = '<i class="ti ti-circle-check"></i> 已下载';
      card.appendChild(dltag);
      renderBumpRows(card, g, null);   // 重进/刷新后仍显改版本条
    }
    return card;
  }

  // ===== 累积更新计划（按版本独立维护 + 跨版本累积）=====
  //   每个有目标版本(pkgVersion)的批次卡下，按当前医院该产品「现场版本 X → 目标版本 Y」调 /api/field/update-plan
  //   拉取 (X,Y] 区间已登记版本的累积「实施任务 + SQL 脚本」+ 完成态。逐条勾选 → /api/field/update-toggle；SQL 支持合并下载。
  //   容器先占位，异步填充（避免阻塞卡渲染）。
  function mkUpdatePlanBlock(g) {
    var box = document.createElement('div');
    box.className = 'f-plan-block';
    box.setAttribute('data-batch', g.batchId);
    box.innerHTML = '<div class="f-plan-loading"><i class="ti ti-loader"></i> 加载更新计划…</div>';
    loadUpdatePlan(g, box);
    return box;
  }
  function loadUpdatePlan(g, box) {
    var site = state.curSite || '';
    if (!site) { box.innerHTML = ''; return; }
    // 2026-08-05 核心更新流重构：数据源换成批次快照（batch.deployPlan），按 batchId 拉。
    var qs = '?site=' + encodeURIComponent(site) + '&batchId=' + encodeURIComponent(g.batchId || '');
    api('/api/field/update-plan' + qs, { method: 'GET' }).then(function (r) {
      var b = r.body || {};
      if (!b.ok) { box.innerHTML = ''; return; }   // 产品不存在等 → 静默不显（不打断卡）
      renderUpdatePlan(g, box, b);
    }).catch(function () { box.innerHTML = ''; });
  }
  // 2026-08-04 re-target：一份统一「实施任务清单」为主体；SQL 执行 = 清单末尾**一个条目**（一个完成态 + 合并下载，不逐脚本）。
  function renderUpdatePlan(g, box, plan) {
    box.innerHTML = '';
    var tasks = Array.isArray(plan.tasks) ? plan.tasks : [];
    var sql = plan.sql || { hasSql: false };
    var vers = Array.isArray(plan.versionsInRange) ? plan.versionsInRange : [];
    var fromV = plan.fromVersion ? escapeHtml(plan.fromVersion) : '（未记录/最早）';
    var totalItems = (plan.taskTotal || 0) + (sql.hasSql ? 1 : 0);
    var doneItems = (plan.taskDone || 0) + (sql.hasSql && sql.done ? 1 : 0);
    // 可折叠区块：默认收起（内存态 state.planExpanded[batchId]），收起态标题行也显进度
    var expanded = state.planExpanded[g.batchId] === true;
    var block = document.createElement('div');
    block.className = 'f-plan-block' + (expanded ? ' open' : '');
    var top = document.createElement('div');
    top.className = 'f-plan-tophd';
    top.innerHTML = '<i class="ti ti-chevron-down chev"></i>' +
      '<span class="ttl"><i class="ti ti-arrow-guide"></i> 更新计划 · 现场 <b>' + fromV + '</b> → 目标 <b>' + escapeHtml(plan.toVersion || '') + '</b> · 覆盖 ' + vers.length + ' 个版本</span>' +
      '<span class="f-plan-prog">' + doneItems + '/' + totalItems + '</span>';
    top.addEventListener('click', function () { state.planExpanded[g.batchId] = !(state.planExpanded[g.batchId] === true); block.classList.toggle('open'); });
    block.appendChild(top);
    var body = document.createElement('div');
    body.className = 'f-plan-body';
    if (!tasks.length && !sql.hasSql) {
      var em = document.createElement('div');
      em.className = 'f-plan-empty';
      em.textContent = plan.noManifest ? (plan.noManifestHint || '该批次尚未审核部署清单（运营审核确认后会出现在这里）') : '该批次部署清单为空';
      body.appendChild(em);
    } else {
      // 一份统一实施任务清单（累积任务逐条 + 末尾 SQL 执行条目）——总进度 = 任务完成 + SQL 单点（若有）
      var sec = document.createElement('div'); sec.className = 'f-plan-sec';
      sec.appendChild(planSecHd('ti-list-check', '实施任务清单', doneItems, totalItems));
      tasks.forEach(function (t) { sec.appendChild(mkPlanTaskItem(g, t)); });
      if (sql.hasSql) sec.appendChild(mkSqlBundleItem(g, plan, sql));   // SQL 执行 = 一个条目，放清单末尾
      body.appendChild(sec);
    }
    block.appendChild(body);
    box.appendChild(block);
  }
  function planSecHd(icon, label, done, total) {
    var hd = document.createElement('div');
    hd.className = 'f-plan-sec-hd';
    hd.innerHTML = '<i class="ti ' + icon + '"></i> ' + escapeHtml(label) + ' <span class="f-plan-prog">' + (done || 0) + '/' + (total || 0) + '</span>';
    return hd;
  }
  // 单条累积任务：checkbox + 版本标签 + 标题 + 说明 + （已完成）完成人/时间
  function mkPlanTaskItem(g, it) {
    var row = document.createElement('div');
    row.className = 'f-plan-item' + (it.done ? ' done' : '');
    var cb = document.createElement('input');
    cb.type = 'checkbox'; cb.className = 'f-plan-cb'; cb.checked = !!it.done;
    cb.addEventListener('change', function () { doTaskToggle(g, it, cb.checked, cb); });
    var main = document.createElement('div');
    main.className = 'f-plan-main';
    var descHtml = it.desc ? ('<div class="f-plan-desc">' + escapeHtml(it.desc) + '</div>') : '';
    var metaHtml = it.done ? ('<div class="f-plan-meta"><i class="ti ti-user"></i> ' + escapeHtml(it.by || '—') + ' · ' + escapeHtml(fmtTime(it.at)) + '</div>') : '';
    main.innerHTML = '<div class="f-plan-title"><span class="f-plan-vtag">' + escapeHtml(it.version || '') + '</span>' + escapeHtml(it.title || '（无标题）') + '</div>' + descHtml + metaHtml;
    row.appendChild(cb); row.appendChild(main);
    return row;
  }
  // SQL 执行条目（清单里的一个点）：一个「已执行」checkbox + 「下载合并 SQL」按钮，不展开正文。
  function mkSqlBundleItem(g, plan, sql) {
    var row = document.createElement('div');
    row.className = 'f-plan-item f-plan-sqlitem' + (sql.done ? ' done' : '');
    var cb = document.createElement('input');
    cb.type = 'checkbox'; cb.className = 'f-plan-cb'; cb.checked = !!sql.done;
    cb.addEventListener('change', function () { doSqlBundleToggle(g, plan, cb.checked, cb); });
    var main = document.createElement('div');
    main.className = 'f-plan-main';
    var verCount = Array.isArray(sql.versions) ? sql.versions.length : 0;
    var titleLine = '<div class="f-plan-title"><i class="ti ti-database"></i> 执行数据库升级 SQL' +
      '<span class="f-plan-exec-hint">（本次合并 ' + (sql.scriptCount || 0) + ' 个脚本 · ' + verCount + ' 个版本 · 在库手动执行后勾选）</span></div>';
    var metaHtml = sql.done ? ('<div class="f-plan-meta"><i class="ti ti-user"></i> ' + escapeHtml(sql.by || '—') + ' · ' + escapeHtml(fmtTime(sql.at)) + '</div>') : '';
    var dl = document.createElement('button');
    dl.type = 'button'; dl.className = 'f-plan-dl';
    dl.innerHTML = '<i class="ti ti-download"></i> 下载合并 SQL';
    dl.addEventListener('click', function () {
      var site = state.curSite || '';
      var u = '/api/field/update-sql-merged?site=' + encodeURIComponent(site) + '&batchId=' + encodeURIComponent(g.batchId || '');
      window.open(u, '_blank');
    });
    main.innerHTML = titleLine + metaHtml;
    main.appendChild(dl);
    row.appendChild(cb); row.appendChild(main);
    return row;
  }
  function refreshPlanBlock(g) {
    var box = document.querySelector('.f-plan-block[data-batch="' + (g.batchId || '') + '"]');
    if (box) loadUpdatePlan(g, box); else loadBatchView();
  }
  // 勾选/取消一条快照任务 → /api/field/update-toggle {kind:'task', batchId, itemId}；成功后刷新该批 plan。
  function doTaskToggle(g, it, done, cb) {
    cb.disabled = true;
    var site = state.curSite || '';
    api('/api/field/update-toggle', { method: 'POST', body: JSON.stringify({ site: site, batchId: g.batchId, kind: 'task', itemId: it.id, done: done }) }).then(function (r) {
      var b = r.body || {};
      if (!b.ok) { cb.disabled = false; cb.checked = !done; showToast(b.error || '操作失败', 'error'); return; }
      showToast(done ? '已标记完成' : '已取消完成', 'success');
      refreshPlanBlock(g);
    }).catch(function () { cb.disabled = false; cb.checked = !done; showToast('操作失败，请重试', 'error'); });
  }
  // 勾选/取消「合并 SQL 单点」→ /api/field/update-toggle {kind:'sql', batchId}；一个完成态（非逐脚本）。
  function doSqlBundleToggle(g, plan, done, cb) {
    cb.disabled = true;
    var site = state.curSite || '';
    api('/api/field/update-toggle', { method: 'POST', body: JSON.stringify({ site: site, batchId: g.batchId, kind: 'sql', done: done }) }).then(function (r) {
      var b = r.body || {};
      if (!b.ok) { cb.disabled = false; cb.checked = !done; showToast(b.error || '操作失败', 'error'); return; }
      showToast(done ? '已标记 SQL 执行完成' : '已取消 SQL 执行标记', 'success');
      refreshPlanBlock(g);
    }).catch(function () { cb.disabled = false; cb.checked = !done; showToast('操作失败，请重试', 'error'); });
  }

  // ========== 2026-08-05 架构重构：删除「部署清单」（FS-06 场景1·标准模板每院勾选）整块 ==========
  //   （原 deployIsNested/deployProdTasks/deployProductsOf/deployAggProgress/mkDeployChecklist/toggleDeployCollapse/mkDeployItem/doDeployToggle）
  //   部署/更新清单改为跟随产品代码（各子系统仓 docs/deploy.json 按 tag 读）→ 见批次卡内「更新计划」块（mkUpdatePlanBlock/loadUpdatePlan，/api/field/update-plan）。
  //   该块原本已不在医院视图渲染路径中调用（dead），此次一并清除，避免残留对 /api/customer-deploy-task 的引用。

  // 下载更新包：调 batch-download → downloads+1（幂等）+ 覆盖单转待验证 + 返回 bumps → 渲染改版本条 + 刷新列表状态
  function doBatchDownload(g, btn, card) {
    btn.disabled = true;
    api('/api/batch-download', { method: 'POST', body: JSON.stringify({ batchId: g.batchId }) }).then(function (r) {
      var b = r.body || {};
      if (!b.ok) { btn.disabled = false; showToast(b.error || '下载失败', 'error'); return; }
      g.downloadedByMe = true;
      btn.disabled = false; btn.innerHTML = '<i class="ti ti-download"></i> 重新下载';   // 保持可点 → 支持多次下载
      if (b.artifactUrl) { try { window.open(b.artifactUrl, '_blank', 'noopener'); } catch (e) {} showToast('更新包已开始下载', 'success'); }
      else showToast('已记录下载，更新包地址待运营发布', 'success');
      renderBumpRows(card, g, b.bumps || []);
      // 覆盖单已转待验证 → 重新拉批次视图刷新逐单验证入口
      loadBatchView();
    }).catch(function () { btn.disabled = false; showToast('下载失败，请重试', 'error'); });
  }

  // 渲染改版本条：我负责的每家医院 × 子系统一条「<医院> <子系统> v_old→v_new」+「一键改版本」；bumps 为空则重进后按当前医院/覆盖医院兜底不渲染。
  function renderBumpRows(card, g, bumps) {
    // 去掉旧的改版本区（幂等：重复下载/刷新不重复插）
    var old = card.querySelector('.f-bump-zone'); if (old) old.parentNode.removeChild(old);
    if (!bumps || !bumps.length) return;   // 无 bumps（如重进无回传）→ 不渲染，避免臆造
    var zone = document.createElement('div');
    zone.className = 'f-bump-zone';
    zone.style.marginTop = '10px';
    bumps.forEach(function (bp) {
      var row = document.createElement('div');
      row.className = 'f-bump-row';
      var subTxt = bp.subsystemLabel || bp.subsystem || '';
      row.innerHTML = '<span class="bp-site">' + escapeHtml(bp.hospital || bp.site || '') + '</span>' +
        (subTxt ? '<span class="bp-sub">' + escapeHtml(subTxt) + '</span>' : '') +
        '<span class="bp-ver">' + escapeHtml(bp.fromVer || '—') + ' → <b>' + escapeHtml(bp.toVer || '—') + '</b></span>';
      var bbtn = document.createElement('button');
      bbtn.type = 'button';
      bbtn.className = 'f-bump-btn';
      bbtn.innerHTML = '<i class="ti ti-refresh"></i> 一键改版本';
      bbtn.addEventListener('click', function () { doBumpVersion(bp, bbtn); });
      row.appendChild(bbtn);
      zone.appendChild(row);
    });
    card.appendChild(zone);
  }

  // 一键改版本：回写 customers.json 该医院该产品/子系统 v_old→v_new（幂等）；成功 → 按钮转「已改版本」
  function doBumpVersion(bp, btn) {
    btn.disabled = true;
    var body = { site: bp.site || bp.hospital, project: bp.product, version: bp.toVer };
    if (bp.subsystem) body.subsystem = bp.subsystem;
    api('/api/customer-version', { method: 'POST', body: JSON.stringify(body) }).then(function (r) {
      var b = r.body || {};
      if (!b.ok) { btn.disabled = false; showToast(b.error || '改版本失败', 'error'); return; }
      btn.classList.add('done'); btn.innerHTML = '<i class="ti ti-circle-check"></i> 已改版本';
      // 同步刷新台账缓存（改版本后现场版本更新，归档条/renderHospChip 随之正确）
      api('/api/customers', { method: 'GET' }).then(function (rr) { if (rr.body && Array.isArray(rr.body.customers)) { state.customers = rr.body.customers; buildSubOptions(); } });
      showToast(b.changed ? ('已回写版本号 ' + (b.toVer || '')) : '已是最新版本', 'success');
    }).catch(function () { btn.disabled = false; showToast('改版本失败，请重试', 'error'); });
  }

  // 批次视图逐单：类型标签 + 标题 + 状态 + 上下文（现场·时间）+（待验证态）「确认验证过」✅ /「反馈问题」按钮。
  function mkBatchItem(t, g) {
    var el = document.createElement('div');
    el.className = 'f-item';
    var tag = TYPE_META[t.type] || { cls: 'req', label: t.type };
    var stTag = t.statusTag || 'tag-gray';
    var stLabel = t.statusLabel || t.lifecycle || '';
    el.innerHTML =
      '<div class="f-item-top">' +
        '<span class="f-tk ' + tag.cls + '">' + escapeHtml(tag.label) + '</span>' +
        '<span class="tag ' + stTag + '">' + escapeHtml(stLabel) + '</span>' +
      '</div>' +
      '<div class="f-item-title">' + escapeHtml(t.title || '（无标题）') + '</div>' +
      '<div class="f-item-ctx">' +
        '<span>' + escapeHtml(t.site || '—') + '</span>' +
      '</div>';
    if (t.canVerify) {
      var actions = document.createElement('div');
      actions.className = 'f-item-verify';
      var vb = document.createElement('button');
      vb.type = 'button'; vb.className = 'f-verify-btn';
      vb.innerHTML = '<i class="ti ti-circle-check"></i> 确认验证过';
      vb.addEventListener('click', function () { doVerify(t, 'pass', null, vb); });
      var rb = document.createElement('button');
      rb.type = 'button'; rb.className = 'f-reject-btn';
      rb.innerHTML = '<i class="ti ti-message-report"></i> 反馈问题';
      rb.addEventListener('click', function () { promptReject(t); });
      actions.appendChild(vb); actions.appendChild(rb);
      el.appendChild(actions);
    }
    return el;
  }

  // 逐单验证 pass/fail：调 intake-verify → 该单转已关闭/已重开 + toast；成功后刷新按批次视图（状态/验证入口/闭环）
  function doVerify(t, result, note, btn) {
    if (btn) btn.disabled = true;
    var body = { project: t.project, id: t.id, result: result };
    if (note) body.note = note;
    api('/api/intake-verify', { method: 'POST', body: JSON.stringify(body) }).then(function (r) {
      var b = r.body || {};
      if (!b.ok) { if (btn) btn.disabled = false; showToast(b.error || '操作失败', 'error'); return; }
      if (result === 'pass') showToast(b.batchDelivered ? '已验证过·该批次已交付' : '已确认现场验证过', 'success');
      else showToast('已反馈打回，工单重新开启', 'success');
      loadBatchView();   // 刷新：验证过的单移出待验证 / 组头随闭环更新
    }).catch(function () { if (btn) btn.disabled = false; showToast('操作失败，请重试', 'error'); });
  }

  // 反馈问题：样式化 textarea 弹窗承载"验证不通过"说明；空/取消不提交
  function promptReject(t) {
    fPrompt({ title: '验证不通过', message: '请填写问题说明（将打回工单、通知运营/开发处理）', type: 'textarea', value: '' }).then(function (note) {
      if (note == null) return;                 // 取消
      note = String(note).trim();
      if (!note) { showToast('请填写反馈说明', 'error'); return; }
      doVerify(t, 'fail', note, null);
    });
  }

  function emptyHtml(icon, title, desc) {
    return '<div class="f-list-empty"><i class="ti ' + icon + '"></i>' +
      '<div class="t">' + escapeHtml(title) + '</div>' +
      '<div class="d">' + escapeHtml(desc) + '</div></div>';
  }

  // AC-10/11/12：按类型三组渲染（空组不渲染）
  function renderTypeView(groups) {
    var box = $('fListType');
    var listBatch = $('fListBatch');
    listBatch.style.display = 'none'; box.style.display = 'block';
    box.innerHTML = '';
    // 2026-08-05 架构重构：医院视图不显示部署清单块（原 FS-06 场景1 标准模板已废，部署清单跟随产品代码 → 批次卡「更新计划」块）。
    // 空态（该医院无记录 / 筛选后为空）
    var total = 0;
    groups.forEach(function (g) { total += (g.items || []).length; });
    if (!total) {
      var em = document.createElement('div');
      em.innerHTML = emptyHtml('ti-inbox', '暂无提交记录', state.curSub ? ('「' + subLabel(state.curSub) + '」子项目下暂无记录') : '该医院还没有提交记录');
      box.appendChild(em);
      return;
    }
    // 组顺序稳定：需求 / BUG / 咨询
    var order = ['requirement', 'bug', 'consult'];
    order.forEach(function (key) {
      var g = null;
      for (var i = 0; i < groups.length; i++) { if (groups[i].key === key) { g = groups[i]; break; } }
      if (!g || !(g.items || []).length) return;   // AC-12：空组不渲染
      box.appendChild(mkTypeGroup(g));
    });
  }

  function mkTypeGroup(g) {
    var meta = TYPE_META[g.key] || { cls: 'req', label: g.label || g.key };
    var wrap = document.createElement('div');
    wrap.className = 'f-type-grp';
    wrap.setAttribute('data-key', g.key);
    var hd = document.createElement('div');
    hd.className = 'f-type-ghd';
    hd.innerHTML = '<span class="gname">' + escapeHtml(g.label || meta.label) + '</span>' +
      '<span class="gcount">' + (g.count != null ? g.count : (g.items || []).length) + '</span>';
    wrap.appendChild(hd);
    (g.items || []).forEach(function (it) { wrap.appendChild(mkItem(it, meta)); });
    return wrap;
  }

  // AC-11：类型标签 + 标题 + 状态标签 + 上下文「子系统 · 医院」+ 时间 yyyy-MM-dd HH:mm
  //   点击「咨询（consult）」记录 → 恢复该会话进右侧对话区、可续问（reopenConsult，同 convId 续存不建重单）。
  //   需求/BUG 本轮不绑点击（避免续聊建重单风险，后续范畴）。
  function mkItem(it, meta) {
    var el = document.createElement('div');
    el.className = 'f-item' + (isReopenable(it) ? ' clickable' : '');
    var tag = TYPE_META[it.type] || meta || { cls: 'req', label: it.type };
    var stTag = it.statusTag || 'tag-gray';
    var stLabel = it.statusLabel || it.lifecycle || '';
    var sub = it.subsystem || '—';
    var site = it.site || '—';
    var time = fmtTime(it.updatedAt || it.submittedAt);
    // 归批工单带批次排期 → 顶行加醒目 chip「计划交付 <date>」（纯 yyyy-MM-dd）；无排期不显。放在类型/状态标签之后。
    var sched = (it.batchSchedule || '').trim();
    // 已出包（已出包/待验证）且归批 → 引导「去下载更新包」：切到「按批次」视图并定位该批次的更新包卡
    var canDl = !!it.batchId && (it.lifecycle === '已出包' || it.lifecycle === '待验证');
    el.innerHTML =
      '<div class="f-item-top">' +
        '<span class="f-tk ' + tag.cls + '">' + escapeHtml(tag.label) + '</span>' +
        '<span class="tag ' + stTag + '">' + escapeHtml(stLabel) + '</span>' +
        (sched ? '<span class="f-sched-chip"><i class="ti ti-calendar-event"></i> 计划交付 ' + escapeHtml(sched) + '</span>' : '') +
      '</div>' +
      '<div class="f-item-title">' + escapeHtml(it.title || '（无标题）') + '</div>' +
      '<div class="f-item-ctx">' +
        '<span>' + escapeHtml(sub) + '</span><span class="sep">·</span>' +
        '<span>' + escapeHtml(site) + '</span><span class="sep">·</span>' +
        '<span>' + escapeHtml(time) + '</span>' +
      '</div>' +
      (canDl ? '<div style="margin-top:8px"><a class="f-godl" role="button" style="display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:#1A6DBE;cursor:pointer;padding:4px 10px;border:1px solid #C7DCF1;border-radius:8px;background:#F4F9FE"><i class="ti ti-package-import"></i> 去下载更新包</a></div>' : '');
    bindReopen(el, it);
    if (canDl) { var gd = el.querySelector('.f-godl'); if (gd) gd.addEventListener('click', function (e) { e.stopPropagation(); goToBatchDownload(it.batchId); }); }
    return el;
  }

  // 从「按类型」条目点「去下载」→ 切到「按批次」视图并滚动+高亮到该批次的更新包卡（引导实施去下载）
  function goToBatchDownload(batchId) {
    setGroupBy('batch');
    setTimeout(function () {
      var t = document.querySelector('#fListBatch [data-batch="' + batchId + '"]');
      if (t) {
        try { t.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) { t.scrollIntoView(); }
        var old = t.style.boxShadow; t.style.transition = 'box-shadow .3s'; t.style.boxShadow = '0 0 0 3px rgba(26,109,190,.4)';
        setTimeout(function () { t.style.boxShadow = old || ''; }, 1500);
      } else { showToast('已切到「按批次」，请在对应批次卡下载更新包', 'info'); }
    }, 450);
  }

  // 点击某条提交记录能否恢复对话续聊：咨询（consult）恢复 consult 会话；需求/BUG（requirement/bug）恢复 intake 会话、续聊走 intake-reply（append 同单，不建重单）。
  function isReopenable(it) { return it && (it.type === 'consult' || it.type === 'requirement' || it.type === 'bug') && it.project && it.id; }
  // 给记录卡片绑定点击 → 按类型分派：consult→reopenConsult；requirement/bug→reopenIntake。mkItem/mkSysItem 两处共用（避免漏系统视图，见 lessons L-026）。
  function bindReopen(el, it) {
    if (!isReopenable(it)) return;
    el.style.cursor = 'pointer';
    el.addEventListener('click', function () { if (it.type === 'consult') reopenConsult(it); else reopenIntake(it); });
  }

  // 点击咨询记录 → 拉详情、把该会话恢复进对话区，可继续追问（consult 同 convId 续存，AC-18/22）。
  //   续聊 project 锁到该 consult 的 project（chat.reopenProject），保证 append 到同一条 consult；不误建新记录。
  function reopenConsult(it) {
    if (!it || it.type !== 'consult' || !it.project || !it.id) return;
    api('/api/intake-detail?project=' + encodeURIComponent(it.project) + '&id=' + encodeURIComponent(it.id), { method: 'GET' }).then(function (r) {
      var item = (r.body && r.body.item) || null;
      if (!item) return;
      // 恢复会话：消息流 + convId + project + kind=consult
      var msgs = Array.isArray(item.chat) ? item.chat.map(function (m) { return { role: (m.role === 'assistant' ? 'assistant' : 'user'), content: m.text || '' }; }).filter(function (m) { return m.content; }) : [];
      chat.messages = msgs;
      chat.convId = item.convId || item.id || '';        // consult 的 convId = 记录 id
      chat.reopenProject = item.project || it.project;    // 续问归属锁定
      chat.reopenSubsystem = item.subsystem || '';        // 续问保留原子系统（append 时 subsystem 不被清空 + 续聊不触发咨询必选拦截）
      chat.savedId = '';                                  // consult 不建工单，不显归档卡
      chat.analyzed = false; chat.lastQ = ''; chat.lastA = ''; chat.deep = false;   // reopen 续聊默认关深入思考（记录未存 deep 态；用户可再手动开）
      // 最近一轮问答（供「沉淀经验库」入口）
      for (var i = msgs.length - 1; i >= 0; i--) { if (!chat.lastA && msgs[i].role === 'assistant') chat.lastA = msgs[i].content; if (!chat.lastQ && msgs[i].role === 'user') chat.lastQ = msgs[i].content; }
      setSubmitKind('consult');                           // 切到咨询答疑模式
      // 清空对话流后逐条渲染进气泡（assistant 用 md()，user 纯文本转义——appendBubble 已按 who 区分：ai 走 md、me 走 md 但内容纯文本无 markdown）
      var box = chatBox(); if (box) box.innerHTML = '';
      msgs.forEach(function (m) { appendBubble(m.role === 'user' ? 'me' : 'ai', m.content); });
      clearPendingImages();   // reopen 续聊 → 重置待附截图（输入态）
      scrollChatBottom();
      saveDraft();
    }).catch(function () {});
  }

  // 点击 需求/BUG 记录 → 拉详情、把该工单沟通记录恢复进对话区，可继续补充。
  //   安全续聊铁律（杜绝重单）：reopen 的工单 chat.savedId=工单 id + chat.reopenIntakeProject=工单 project；再发言走 intake-reply（append 到同一张单）而非 intake-chat（后者服务端无幂等、会再建单）。见 sendChat 分派。
  function reopenIntake(it) {
    if (!it || (it.type !== 'requirement' && it.type !== 'bug') || !it.project || !it.id) return;
    api('/api/intake-detail?project=' + encodeURIComponent(it.project) + '&id=' + encodeURIComponent(it.id), { method: 'GET' }).then(function (r) {
      var item = (r.body && r.body.item) || null;
      if (!item) return;
      // 恢复会话：把工单 chat（含 user/assistant/dev 多角色）转成气泡流。dev（开发回复）并入 assistant 侧展示。
      var msgs = Array.isArray(item.chat) ? item.chat.map(function (m) { return { role: (m.role === 'user' ? 'user' : 'assistant'), content: m.text || '' }; }).filter(function (m) { return m.content; }) : [];
      chat.messages = msgs;
      chat.convId = '';                                   // intake 不用 convId（intake-reply 靠 project+id 定位）
      chat.savedId = item.id || it.id;                    // ★ 标记为已建单（工单 id）：续聊走 intake-reply、不再建新单
      chat.reopenIntakeProject = item.project || it.project; // ★ 锁定工单 project（intake-reply 据此 append 到同一张单）
      chat.reopenProject = ''; chat.reopenSubsystem = ''; // 清 consult 续聊锁定（本次是 intake reopen，非 consult）
      chat.analyzed = false; chat.lastQ = ''; chat.lastA = ''; chat.deep = false;
      for (var i = msgs.length - 1; i >= 0; i--) { if (!chat.lastA && msgs[i].role === 'assistant') chat.lastA = msgs[i].content; if (!chat.lastQ && msgs[i].role === 'user') chat.lastQ = msgs[i].content; }
      setSubmitKind('intake');                            // 切到提需求/报BUG 模式（intake）
      var box = chatBox(); if (box) box.innerHTML = '';
      msgs.forEach(function (m) { appendBubble(m.role === 'user' ? 'me' : 'ai', m.content); });
      appendArchiveCard({ id: chat.savedId, type: item.type || it.type, site: item.site || '', subsystem: item.subsystem || '', version: item.version || '' });   // 显「已建单 <id>（<类型>）」归档卡片
      clearPendingImages();
      scrollChatBottom();
      saveDraft();
    }).catch(function () {});
  }

  // ========== FS-03 · 系统视图（跨医院聚合清单 + 归档版本模型） ==========

  // AC-6~10：加载跨医院聚合清单（选某系统→跨全部负责医院、只该 subsystem；全部系统→各系统分组）。
  //   数据源 = /api/field/submissions?dimension=sys（服务端按 me.sites 收敛越权数据；边界不信任前端传参）。
  function loadSystemView() {
    if (state.mode !== 'sys') return;
    var box = $('fListSystem'); if (!box) return;
    box.style.display = 'block';
    box.innerHTML = '<div class="f-list-empty"><div class="d">加载中…</div></div>';
    var qs = '?dimension=sys' + (state.curSys ? '&system=' + encodeURIComponent(state.curSys) : '');
    api('/api/field/submissions' + qs, { method: 'GET' }).then(function (r) {
      renderSystemView(((r.body || {}).groups) || []);
    }).catch(function () {
      box.innerHTML = emptyHtml('ti-alert-triangle', '加载失败', '请稍后重试');
    });
  }

  // AC-7/8/9：顶部提示条 .f-xnote（两态文案）+ 各系统分组（组头系统名 + 条数）
  function renderSystemView(groups) {
    var box = $('fListSystem'); if (!box) return;
    box.style.display = 'block';
    box.innerHTML = '';
    // 提示条（选某系统 / 全部系统）
    var note = document.createElement('div');
    note.className = 'f-xnote';
    if (state.curSys) {
      note.innerHTML = '<i class="ti ti-affiliate"></i> 跨你负责的<b>全部医院</b>，只看「<b>' + escapeHtml(sysLabel(state.curSys)) + '</b>」系统的提交记录';
    } else {
      note.innerHTML = '<i class="ti ti-affiliate"></i> 已忽略医院维度：聚合你负责的<b>全部医院</b>，按系统查看提交记录';
    }
    box.appendChild(note);
    // 空态
    var total = 0;
    groups.forEach(function (g) { total += (g.items || []).length; });
    if (!total) {
      var em = document.createElement('div');
      em.innerHTML = emptyHtml('ti-inbox', '暂无提交记录',
        state.curSys ? ('「' + state.curSys + '」系统在你负责的医院暂无记录') : '你负责的医院暂无提交记录');
      box.appendChild(em);
      return;
    }
    // 各系统一分组（后端已按稳定顺序返回；选某系统时只有一组）
    groups.forEach(function (g) { if ((g.items || []).length) box.appendChild(mkSysGroup(g)); });
  }

  function mkSysGroup(g) {
    var wrap = document.createElement('div');
    wrap.className = 'f-sys-grp';
    wrap.setAttribute('data-sys', g.key);
    var hd = document.createElement('div');
    hd.className = 'f-sys-ghd';
    hd.innerHTML = '<i class="ti ti-git-fork"></i>' +
      '<span class="gname">' + escapeHtml(g.label || g.key) + '</span>' +
      '<span class="gcount">' + (g.count != null ? g.count : (g.items || []).length) + '</span>';
    wrap.appendChild(hd);
    // 系统视图条目：跨医院聚合 → 上下文显示「医院 · 时间」（子系统即分组名，无需重复）
    (g.items || []).forEach(function (it) { wrap.appendChild(mkSysItem(it)); });
    return wrap;
  }

  function mkSysItem(it) {
    var el = document.createElement('div');
    // 问题②：系统视图记录同样可点击 reopen（镜像 mkItem：consult→reopenConsult、requirement/bug→reopenIntake；it 带 project+id+type，见 server mapItem 两维度复用）
    el.className = 'f-item' + (isReopenable(it) ? ' clickable' : '');
    var tag = TYPE_META[it.type] || { cls: 'req', label: it.type };
    var stTag = it.statusTag || 'tag-gray';
    var stLabel = it.statusLabel || it.lifecycle || '';
    var site = it.site || '—';
    var time = fmtTime(it.updatedAt || it.submittedAt);
    // 归批工单带批次排期 → 顶行加同款醒目 chip「计划交付 <date>」（同 mkItem，仅非空才显）。
    var sched = (it.batchSchedule || '').trim();
    el.innerHTML =
      '<div class="f-item-top">' +
        '<span class="f-tk ' + tag.cls + '">' + escapeHtml(tag.label) + '</span>' +
        '<span class="tag ' + stTag + '">' + escapeHtml(stLabel) + '</span>' +
        (sched ? '<span class="f-sched-chip"><i class="ti ti-calendar-event"></i> 计划交付 ' + escapeHtml(sched) + '</span>' : '') +
      '</div>' +
      '<div class="f-item-title">' + escapeHtml(it.title || '（无标题）') + '</div>' +
      '<div class="f-item-ctx">' +
        '<span><i class="ti ti-building-hospital" style="font-size:12px"></i> ' + escapeHtml(site) + '</span><span class="sep">·</span>' +
        '<span>' + escapeHtml(time) + '</span>' +
      '</div>';
    bindReopen(el, it);
    return el;
  }

  // ---------- 归档版本模型（AC-13~21，两类务必区分） ----------
  // SUB_PRODUCT 反查（NH-1）：含该子系统 name 的产品即其所属产品 → 定归档 chip 产品名 + tag 版本集
  function productOfSystem(sysName) {
    for (var i = 0; i < state.systems.length; i++) {
      if (state.systems[i] && state.systems[i].name === sysName) return state.systems[i];   // {key,name,project,productName}
    }
    return null;
  }

  // 运营 tag 版本（/api/versions?project=），带缓存；拿到后回调重渲染 chip。空则占位不报错（AC-17）。
  function ensureVersions(projId, cb) {
    if (!projId) { cb([]); return; }
    if (state.verMap[projId]) { cb(state.verMap[projId]); return; }
    api('/api/versions?project=' + encodeURIComponent(projId), { method: 'GET' }).then(function (r) {
      var vs = (r.body && Array.isArray(r.body.versions)) ? r.body.versions : [];   // 最新在前（后端已倒序）
      state.verMap[projId] = vs;
      cb(vs);
    }).catch(function () { state.verMap[projId] = []; cb([]); });
  }

  // 归档上下文 chip：系统视图=运营 tag 版本下拉；医院视图=现场版本只读并列。两类不混用（AC-21）。
  function updateCtx() {
    var ctx = $('fCtx'); if (!ctx) return;
    state.verOpen = false;
    if (state.mode === 'sys') {
      // AC-16：全部系统 → 退化文案，无具体版本下拉
      if (!state.curSys) { ctx.innerHTML = '<i class="ti ti-stack-2"></i> 全部系统 · 各系统按运营版本'; return; }
      // AC-13：📦 产品 · 子系统 · 版本▾（版本 = /api/versions?project=<产品id> · git tag）
      var sys = productOfSystem(state.curSys);
      var prodName = sys ? (sys.productName || sys.project) : '—';
      var projId = sys ? sys.project : '';
      // 先渲染无版本占位（异步拿 tag），拿到后再刷新（避免闪烁前先占位）
      ensureVersions(projId, function (vers) {
        if (state.mode !== 'sys' || state.curSys !== (sys ? sys.name : null)) return;   // 期间切了系统 → 丢弃
        renderSysChip(ctx, prodName, sys ? sys.name : state.curSys, vers);
      });
    } else {
      // AC-18/19/20：🏥 医院 · 现场版本：产品1 ver1 · 产品2 ver2 …（customers.json products[].version，只读、无下拉）
      renderHospChip(ctx, state.curSite);
    }
  }

  // 系统视图归档 chip（tag 版本下拉，最新在前 + 首项「最新」+ 选中打勾 + 头部提示）
  function renderSysChip(ctx, prodName, sysName, vers) {
    // AC-15：未手动选或所选已失效 → 默认取 versions[0]（最新）
    if (!state.ctxVer || vers.indexOf(state.ctxVer) < 0) state.ctxVer = vers.length ? vers[0] : null;
    var verHtml;
    if (!vers.length) {
      // AC-17：无 tag → 占位 —，无下拉，不报错
      verHtml = '<span class="f-ver-empty" id="fVerEmpty">—</span>';
    } else {
      var opts = vers.map(function (v, i) {
        return '<div class="opt' + (v === state.ctxVer ? ' on' : '') + '" data-v="' + escapeHtml(v) + '">' +
          escapeHtml(v) + (i === 0 ? ' <span class="latest">最新</span>' : '') +
          '<i class="ti ti-check chk"></i></div>';
      }).join('');
      verHtml = '<span class="f-ver" id="fVer">' + escapeHtml(state.ctxVer) +
        ' <i class="ti ti-chevron-down" style="font-size:13px;opacity:.7"></i></span>' +
        '<div class="f-ver-menu' + (state.verOpen ? ' open' : '') + '" id="fVerMenu">' +
        '<div class="vm-h">运营维护版本(tag) · 提问基于此版本</div>' + opts + '</div>';
    }
    ctx.innerHTML = '<i class="ti ti-package"></i> <b>' + escapeHtml(prodName) + '</b> · ' +
      escapeHtml(sysLabel(sysName)) + ' · ' + verHtml;   // 子系统显中文 desc（audit→审方，sysLabel=desc||name）
    // 绑定：点版本触发器展开/收起；点某版本项选定
    var trig = $('fVer');
    if (trig) trig.addEventListener('click', function (e) {
      e.stopPropagation();
      var menu = $('fVerMenu'); if (!menu) return;
      var open = menu.classList.contains('open');
      closeAllMenus();
      if (!open) { menu.classList.add('open'); state.verOpen = true; }
    });
    ctx.querySelectorAll('.f-ver-menu [data-v]').forEach(function (o) {
      o.addEventListener('click', function (e) {
        e.stopPropagation();
        state.ctxVer = o.getAttribute('data-v');   // AC-15：选定 → ctxVer 更新、chip 文案更新、下拉收起
        updateCtx();
      });
    });
  }

  // ========== 维保到期（FS-05 新增：实施端可编辑回写） ==========
  //   两处入口：① 医院视图归档条常驻显示「维保到期」并可点编辑；② 待办提醒里的维保项点进去也能改。
  function custBySite(site) {
    var nm = String(site || '').trim();
    for (var i = 0; i < state.customers.length; i++) {
      if ((state.customers[i].name || '').trim() === nm) return state.customers[i];
    }
    return null;
  }
  // date-only 剩余天数（避免时区 off-by-one：两边归一到本地 00:00 再算）；非法日期 → null
  function maintainDaysLeft(me) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(me || ''))) return null;
    var p = me.split('-');
    var end = Date.UTC(+p[0], +p[1] - 1, +p[2]);
    var n = new Date();
    var today = Date.UTC(n.getFullYear(), n.getMonth(), n.getDate());
    return Math.round((end - today) / 86400000);
  }
  // 维保到期常驻 chip（含颜色态 + 编辑入口）：空显「未设置」；≤15 天标黄、已过期标红
  function maintainChipHtml(site) {
    var cust = custBySite(site);
    var me = cust ? String(cust.maintainEnd || '').trim() : '';
    var dl = maintainDaysLeft(me);
    var tone = '', bg = '', extra = '';
    if (me && dl != null) {
      if (dl < 0) { tone = '#B4232A'; bg = '#FBECEC'; extra = ' · 已过期' + (-dl) + '天'; }
      else if (dl <= 15) { tone = '#8A6100'; bg = '#FCF3E2'; extra = ' · 剩' + dl + '天'; }
    }
    var valHtml = me
      ? '<b style="' + (tone ? 'color:' + tone : '') + '">' + escapeHtml(me) + '</b>' + (extra ? '<span style="font-size:11.5px;' + (tone ? 'color:' + tone : 'color:#5A6573') + '">' + escapeHtml(extra) + '</span>' : '')
      : '<b style="color:#5A6573">未设置</b>';
    return '<span class="f-maintain" id="fMaintainChip"' + (bg ? ' style="background:' + bg + ';border-radius:6px;padding:1px 7px"' : '') + '>' +
      '<i class="ti ti-shield-check" style="font-size:14px;color:' + (tone || 'var(--color-primary)') + '"></i> 维保到期：' + valHtml +
      ' <button type="button" class="f-maintain-edit" id="fMaintainEdit" title="编辑维保到期" aria-label="编辑维保到期" style="border:none;background:none;cursor:pointer;color:var(--color-primary);padding:0 2px;font-size:12.5px"><i class="ti ti-pencil"></i></button></span>';
  }
  // 绑定 chip 里的编辑按钮（renderHospChip 每次重渲后调）
  function bindMaintainEdit(site) {
    var btn = $('fMaintainEdit');
    if (btn) btn.addEventListener('click', function (e) { e.stopPropagation(); openMaintainEdit(site); });
  }
  // 样式化输入弹窗（替代 native prompt）→ Promise<string|null>（取消=null）。type: 'date' | 'text' | 'textarea'
  function fPrompt(opts) {
    opts = opts || {};
    return new Promise(function (resolve) {
      var mask = $('fModalMask');
      if (!mask) { resolve(window.prompt(opts.message || opts.title || '', opts.value || '')); return; }
      $('fmTitle').textContent = opts.title || '';
      $('fmMsg').textContent = opts.message || '';
      var type = opts.type === 'date' ? 'date' : (opts.type === 'textarea' ? 'textarea' : 'text');
      $('fmBody').innerHTML = type === 'textarea'
        ? '<textarea class="input" id="fmInput" rows="3" style="resize:vertical"></textarea>'
        : '<input type="' + type + '" class="input" id="fmInput">';
      var inp = $('fmInput'); inp.value = opts.value || ''; if (opts.placeholder) inp.placeholder = opts.placeholder;
      mask.classList.add('open');
      setTimeout(function () { try { inp.focus(); } catch (e) {} }, 30);
      function cleanup() { mask.classList.remove('open'); $('fmOk').onclick = null; $('fmCancel').onclick = null; mask.onclick = null; document.removeEventListener('keydown', onKey); }
      function done(v) { cleanup(); resolve(v); }
      function onKey(e) { if (e.key === 'Escape') done(null); else if (e.key === 'Enter' && type !== 'textarea') done(inp.value); }
      $('fmOk').onclick = function () { done(inp.value); };
      $('fmCancel').onclick = function () { done(null); };
      mask.onclick = function (e) { if (e.target === mask) done(null); };
      document.addEventListener('keydown', onKey);
    });
  }

  // 维保到期编辑 → 样式化 date 弹窗（app 风格）→ POST /api/customer-maintain
  function openMaintainEdit(site) {
    var nm = String(site || '').trim();
    if (!nm) { showToast('请先选择医院', 'error'); return; }
    var cust = custBySite(nm);
    var cur = cust ? String(cust.maintainEnd || '').trim() : '';
    fPrompt({ title: '设置维保到期', message: '医院：' + nm, type: 'date', value: cur }).then(function (val) {
      if (val == null) return;                 // 取消
      val = String(val).trim();
      if (!val) return;                        // 空 = 不改（本期不支持清空）
      if (!/^\d{4}-\d{2}-\d{2}$/.test(val)) { showToast('日期格式须为 yyyy-MM-dd', 'error'); return; }
      doMaintainSave(nm, val);
    });
  }
  function doMaintainSave(site, val) {
    api('/api/customer-maintain', { method: 'POST', body: JSON.stringify({ site: site, maintainEnd: val }) }).then(function (r) {
      var b = r.body || {};
      if (!b.ok) { showToast(b.error || '保存失败', 'error'); return; }
      // 成功后刷新 state.customers（整表返回）+ 重新拉待办 + 重渲当前归档条
      if (b.customers && Array.isArray(b.customers)) state.customers = b.customers;
      else { var c = custBySite(site); if (c) c.maintainEnd = val; }
      showToast('已更新维保到期 ' + val, 'success');
      try { updateCtx(); } catch (e) {}     // 重渲医院视图归档条（维保 chip 随之更新颜色态）
      try { loadTodo(); } catch (e) {}       // 重新拉待办（维保提醒随新到期日变化）
    }).catch(function () { showToast('保存失败，请重试', 'error'); });
  }

  // 医院视图归档 chip（现场版本，只读 · AC-18/19/20）
  //   ⚠️ 2026-07-24 问题②：归档条不再显示医院名（顶栏已有医院选择器，重复占位），也去前导医院图标 → 各分支直接起头。
  //   两分支（2026-07-24 问题②/③）：
  //   ① 选中具体子系统（state.curSub 非空）→ 「系统：<subLabel(curSub)> · 版本：<subVersion(curSub) 或 —>」，
  //      不再挂产品级「现场版本」列（系统已选定，产品级版本列表冗余且逻辑不对）。版本取 subVersion（该医院该子系统维护的版本；旧形状兜底=产品级 version；空显「—」）。
  //   ② 未选子系统（全部子项目，curSub 空）→ 「现场版本：<产品名(多产品『、』连接)>」+ 一枚 icon 按钮
  //      （2026-07-24 问题③：早前把该医院所有子系统+版本平铺并列 → 又长又换行，观感乱。改成只显紧凑产品名摘要，
  //       点 icon 弹「版本明细」面板逐产品列各子系统版本；数据源同 renderVerDetailRows/新旧形状兼容）。
  function renderHospChip(ctx, site) {
    // 2026-07-24 问题②：归档条不再重复显示医院名（顶栏已有医院选择器），也去前导医院图标 → 各分支直接从「现场版本：」/「系统：」起头。
    //   site 仍用于数据取值（下方 customers 匹配、currentArchive.out.site、&subsystem 过滤一律不动），只是归档条不显示它。
    if (!site) { ctx.innerHTML = '现场版本：未上线产品'; return; }
    // 分支①：选中具体子系统 → 只显该子系统 + 其版本，去掉产品级现场版本列（+ 常驻维保到期）
    if (state.curSub) {
      var sv = subVersion(state.curSub);
      ctx.innerHTML = '系统：' + escapeHtml(subLabel(state.curSub)) +
        ' · 版本：<b>' + escapeHtml(sv || '—') + '</b>' +
        ' <span class="f-ctx-sep">·</span> ' + maintainChipHtml(site);
      bindMaintainEdit(site);
      return;
    }
    // 分支②：未选子系统（全部子项目）→ 紧凑产品名摘要 + 版本明细 icon（不再平铺所有子系统版本）
    var cust = null;
    for (var i = 0; i < state.customers.length; i++) {
      if ((state.customers[i].name || '').trim() === String(site).trim()) { cust = state.customers[i]; break; }
    }
    var hasProd = cust && Array.isArray(cust.products) && cust.products.length;
    if (!hasProd) {
      // AC-20：无 products → 「未上线产品」占位，不显 icon（问题②：去医院名，直接从「现场版本：」起头）+ 常驻维保到期
      ctx.innerHTML = '现场版本：未上线产品' +
        ' <span class="f-ctx-sep">·</span> ' + maintainChipHtml(site);
      bindMaintainEdit(site);
      return;
    }
    // 产品名摘要（多产品用『、』连接；仅产品名，不平铺子系统/版本）
    var prodNames = cust.products.map(function (pr) {
      var proj = state.projMap[pr.project];
      return escapeHtml((proj && proj.name) || pr.project || '');
    }).filter(Boolean).join('、');
    // 紧凑摘要 + icon 按钮（title=查看各子系统版本）；点开由 buildVerDetailPanel 逻辑接管（问题②：去医院名，直接从「现场版本：」起头）+ 常驻维保到期
    ctx.innerHTML = '现场版本：' + (prodNames || '—') +
      ' <button type="button" class="f-verdd-btn" id="fVerDetailBtn" title="查看各子系统版本" aria-label="查看各子系统版本">' +
      '<i class="ti ti-list-details"></i></button>' +
      '<div class="f-verdd-panel f-sysdd-panel" id="fVerDetail"></div>' +
      ' <span class="f-ctx-sep">·</span> ' + maintainChipHtml(site);
    bindMaintainEdit(site);
    // 绑定 icon 触发器：点开/收起版本明细面板（position:fixed 逃 .f-rtool overflow 裁剪）
    var vbtn = $('fVerDetailBtn'), vpanel = $('fVerDetail');
    if (vbtn && vpanel) {
      vpanel.innerHTML = renderVerDetailRows(cust);
      vpanel.addEventListener('click', function (e) { e.stopPropagation(); });
      vbtn.addEventListener('click', function (e) {
        e.stopPropagation();
        var open = state.verDetailOpen && vpanel.classList.contains('open');
        closeAllMenus();
        if (!open) {
          state.verDetailOpen = true;
          vpanel.classList.add('open');
          var pr = vbtn.getBoundingClientRect();
          vpanel.style.top = (pr.bottom + 4) + 'px';
          // 面板宽 260，靠右对齐 icon 右边、避免溢出视口
          var left = Math.max(8, pr.right - 260);
          vpanel.style.left = left + 'px';
        }
      });
    }
  }

  // 版本明细面板内容：逐产品 → 其各子系统 + 版本（新形状按子系统各自版本；旧形状兜底该产品全部子系统 @ 产品级 version）。
  //   子系统中文名走 subLabel/产品目录 desc，版本等宽（--font-num）对齐；无任何子系统版本信息 → 占位提示。
  function renderVerDetailRows(cust) {
    var out = '';
    (cust.products || []).forEach(function (pr) {
      var proj = state.projMap[pr.project];
      var pn = (proj && proj.name) || pr.project || '';
      // 该产品目录定义的全部子系统（name→desc 映射 + 旧形状兜底列全部子系统）
      var catalog = (proj && Array.isArray(proj.subsystems) ? proj.subsystems : []).map(function (s) {
        var nm = typeof s === 'string' ? s : (s && s.name) || '';
        var dc = typeof s === 'string' ? '' : (s && s.desc) || '';
        return { name: nm, desc: dc || nm };
      }).filter(function (o) { return o.name; });
      var rows;
      if (pr.subsystems && Array.isArray(pr.subsystems) && pr.subsystems.length) {
        // 新形状：列该医院实际维护的子系统 + 各自版本（desc 从产品目录查 name→desc）
        var descOf = {}; catalog.forEach(function (o) { descOf[o.name] = o.desc; });
        rows = pr.subsystems.map(function (ms) {
          var nm = (ms && ms.name) || '';
          return { label: descOf[nm] || nm, version: (ms && ms.version) || '' };
        }).filter(function (o) { return o.label; });
      } else {
        // 旧形状（或新形状无勾选）：兜底列该产品全部子系统 @ 产品级 version（与 buildSubOptions 一致）
        var pv = pr.version || '';
        rows = catalog.map(function (o) { return { label: o.desc, version: pv }; });
      }
      out += '<div class="f-verdd-grp">' + escapeHtml(pn) + '</div>';
      if (rows.length) {
        out += rows.map(function (r) {
          return '<div class="f-verdd-row"><span class="nm">' + escapeHtml(r.label) +
            '</span><span class="ver">' + escapeHtml(r.version || '—') + '</span></div>';
        }).join('');
      } else {
        out += '<div class="f-verdd-empty">暂无子系统版本信息</div>';
      }
    });
    return out || '<div class="f-verdd-empty">暂无子系统版本信息</div>';
  }

  // ========== FS-04 · AI 对话提交（判类 / 补要素 / 归档 → 建工单 / 咨询） ==========
  // 对话四步：① 现场自然语言输入 → ② AI 判类型 + 追问补要素 → ③ 归档建议确认 → ④ 建单(intake-chat/intake-submit)/咨询(consult)
  var chat = {
    submitKind: 'consult',   // 'intake'（提需求/报BUG，走 intake-chat/intake-submit + analyze）| 'consult'（咨询答疑，走 consult SSE）；2026-07-23 裁决默认咨询答疑
    messages: [],           // 会话历史 [{role:'user'|'assistant', content}]（传后端 + 恢复草稿）
    savedId: '',            // 幂等：本会话已建工单 id（非空=已建单，不重复建 · AC-12/22）
    convId: '',             // 咨询续问会话 id（同 convId 续存不新建 · AC-18/22）
    analyzed: false,        // 是否已展示过 AI 初判（避免重复 analyze）
    sending: false,         // 发送中（防并发/防重复）
    lastQ: '', lastA: '',   // 最近一轮问答（供咨询「沉淀经验库」kb-from-consult）
    reopenProject: '',      // 点击咨询记录续聊时锁定该 consult 的 project（保证续问 append 到同一条 consult：同 convId + 同 project）
    reopenSubsystem: '',     // 续聊时锁定该 consult 的原子系统（续问 append 时不清空 subsystem；且续聊不触发咨询必选拦截）
    reopenIntakeProject: '', // 点击 需求/BUG 记录 reopen 后锁定该工单的 project（续聊走 intake-reply append 到同一张单、绝不建重单；配合 savedId=工单 id）
    deep: false,             // 「深入思考」开关（默认关=基于 spec+经验库；开=sendConsult 带 deep:true，后端检索源码更深入分析）；仅 consult 生效
    // FS-04 · 每个"系统上下文"各记一段会话（会话内内存态；切系统时保存旧段 + 恢复新段，未聊过→空会话）
    bySystem: {},           // 系统上下文键 systemKey() → 会话快照（切系统时存/取；纯内存态，不进任何端存储，刷新丢失可接受——已发咨询可点记录 reopen）
    lastSystemKey: null      // 上一次同步时的系统上下文键（null=尚未建立基线；首次切换据它把当前会话存进旧桶）
  };

  // FS-04/FS-06 图片：待发送截图（本次输入态，data URL 数组，≤6）。每次发送后清空。
  //   纯输入态：不进 per-system 会话快照、不进草稿端存储（避免大对象膨胀），发送后即弃。
  var pendingImages = [];
  var IMG_MAX = 6;           // 最多 6 张（对齐后端 b.images.slice(0,6) + MAX_BODY 30MB 上限）

  // 当前"系统上下文"稳定键：医院视图=医院||子系统（curSite||curSub），系统视图='sys||'+子系统（curSys）。
  //   尾部空串（「全部子项目」/「全部系统」）也是合法会话槽——那里只能发 intake 或空对话（consult 受必选守卫拦截）。
  function systemKey() {
    if (state.mode === 'sys') return 'sys||' + (state.curSys || '');
    return (state.curSite || '') + '||' + (state.curSub || '');
  }

  // 把当前 chat 相关字段打成一份快照（覆盖会话全量：消息流 + 会话/提交态 + reopen 锁定 + 输入框值）。
  function snapshotConversation() {
    var input = $('fChatInput');
    return {
      messages: chat.messages.slice(),
      submitKind: chat.submitKind,
      convId: chat.convId,
      savedId: chat.savedId,
      analyzed: chat.analyzed,
      lastQ: chat.lastQ,
      lastA: chat.lastA,
      reopenProject: chat.reopenProject || '',
      reopenSubsystem: chat.reopenSubsystem || '',
      reopenIntakeProject: chat.reopenIntakeProject || '',   // 随系统会话记录：切回 reopen 的工单仍锁 project，续聊仍走 intake-reply（不建重单）
      deep: !!chat.deep,   // 「深入思考」设置随每个系统会话各记各的，切回恢复
      input: input ? input.value : ''
    };
  }

  // 从快照恢复一段会话到右侧对话区（清空对话流后逐条重渲染：user 走 me、assistant 走 ai，均经 md() 受控渲染）。
  function restoreConversation(snap) {
    chat.messages = Array.isArray(snap.messages) ? snap.messages.slice() : [];
    chat.submitKind = (snap.submitKind === 'intake') ? 'intake' : 'consult';
    chat.convId = snap.convId || '';
    chat.savedId = snap.savedId || '';
    chat.analyzed = !!snap.analyzed;
    chat.lastQ = snap.lastQ || '';
    chat.lastA = snap.lastA || '';
    chat.reopenProject = snap.reopenProject || '';
    chat.reopenSubsystem = snap.reopenSubsystem || '';
    chat.reopenIntakeProject = snap.reopenIntakeProject || '';   // 恢复 reopen 的工单锁定 project（切回续聊仍走 intake-reply）
    chat.deep = !!snap.deep;   // 恢复该系统会话的「深入思考」设置
    chat.sending = false;
    setSubmitKind(chat.submitKind);   // 同步类型切换器按钮态 + 输入框 placeholder + 深入思考开关显隐（内部会 syncDeep + saveDraft）
    var box = chatBox();
    if (box) {
      box.innerHTML = '';
      chat.messages.forEach(function (m) { appendBubble(m.role === 'user' ? 'me' : 'ai', m.content); });
      if (chat.savedId) appendArchiveCard({ id: chat.savedId, type: '', site: '', subsystem: '', version: '' });
      if (!chat.messages.length) {
        // 该桶曾聊过但被清空（如新对话后又切走）→ 复用新对话占位
        var ph = document.createElement('div'); ph.className = 'f-ws-placeholder'; ph.id = 'fWsPlaceholder';
        ph.innerHTML = '<i class="ti ti-message-chatbot"></i>' +
          '<div class="t">AI 对话提交</div>' +
          '<div class="d">用一句大白话说说想要的功能 / 遇到的问题，AI 帮你判类、补要素、归档建单</div>' +
          '<div class="f-ws-scope" id="fWsScope">—</div>';
        box.appendChild(ph);
      }
    }
    var input = $('fChatInput'); if (input) input.value = snap.input || '';
    clearPendingImages();   // 切系统恢复会话 → 重置待附截图（图片是输入态，不随会话快照带走）
    setSending(false);
    updateScope();
    saveDraft();
  }

  // 核心：切系统上下文时同步右侧对话（幂等——键没变即 no-op，故可在所有切换点末尾广撒调用，安全）。
  //   ① 键没变 → 直接返回；② 有旧键 → 把"当前"会话快照存进旧桶（此刻 chat.messages 还是旧系统的，正确）；
  //   ③ 更新 lastSystemKey；④ 新桶有快照 → restoreConversation；否则 → newConversation（该系统还没聊过 = 全新空会话）。
  function syncConversationToSystem() {
    var newKey = systemKey();
    if (newKey === chat.lastSystemKey) return;
    if (chat.lastSystemKey != null) chat.bySystem[chat.lastSystemKey] = snapshotConversation();
    chat.lastSystemKey = newKey;
    if (chat.bySystem[newKey]) restoreConversation(chat.bySystem[newKey]);
    else newConversation();
  }

  // 当前归档上下文（project/subsystem/version/site）——来自 chip（FS-03 版本模型）+ 当前视图。site 服务端会再收敛到 sites。
  function currentArchive() {
    var out = { project: '', subsystem: '', version: '', site: '' };
    // 续聊（点击了某条 consult 记录恢复会话）：project 锁到原 consult 的 project，保证 append 到同一条 consult（同 convId + 同 project）。
    //   仅 consult 续聊生效（reopenProject 仅在 reopenConsult 里设、newConversation 清）；其余字段仍随当前视图上下文。
    if (chat.reopenProject && chat.submitKind === 'consult') {
      out.project = chat.reopenProject;
      out.subsystem = chat.reopenSubsystem || '';   // 保留原 consult 的子系统：续问 append 时服务端 subsystem: sub 不被清空（修 reopen 续聊丢 subsystem 隐患）
      out.site = state.curSite || (state.sites.length ? state.sites[0] : '');
      out.version = state.ctxVer || '';
      return out;
    }
    if (state.mode === 'sys') {
      // 系统视图：产品=含该子系统的产品；子系统=curSys；版本=ctxVer（运营 tag）
      var sys = state.curSys ? productOfSystem(state.curSys) : null;
      if (sys) { out.project = sys.project || ''; out.subsystem = sys.name || ''; }
      out.version = state.ctxVer || '';
      out.site = state.curSite || (state.sites.length ? state.sites[0] : '');
    } else {
      // 医院视图：site=当前所选医院；产品/版本取该医院已上产品（选了子项目→取拥有该子系统的产品；否则取首个产品）
      out.site = state.curSite || '';
      var cust = null;
      for (var i = 0; i < state.customers.length; i++) {
        if ((state.customers[i].name || '').trim() === String(out.site).trim()) { cust = state.customers[i]; break; }
      }
      var prods = (cust && Array.isArray(cust.products)) ? cust.products : [];
      var chosen = null;
      if (state.curSub) {
        // 选了子项目：找拥有该子系统 name 的产品
        for (var j = 0; j < prods.length; j++) {
          var pj = state.projMap[prods[j].project];
          var subs = (pj && Array.isArray(pj.subsystems)) ? pj.subsystems : [];
          var hit = subs.some(function (s) { return (typeof s === 'string' ? s : (s && s.name) || '') === state.curSub; });
          if (hit) { chosen = prods[j]; break; }
        }
        out.subsystem = state.curSub;
      }
      if (!chosen && prods.length) chosen = prods[0];
      if (chosen) { out.project = chosen.project || ''; }
      // 版本：选了具体子系统 → 取该医院对该子系统维护的版本（subVersion，新形状按子系统查、旧形状兜底为产品级 version）；
      //   未选（全部子项目）→ 回退产品级 version（旧形状），新形状无产品级 version 时空串。
      if (state.curSub) out.version = subVersion(state.curSub);
      else if (chosen) out.version = chosen.version || '';
    }
    return out;
  }

  // ---------- 对话流渲染 ----------
  function chatBox() { return $('fChatB'); }
  function clearPlaceholder() { var ph = $('fWsPlaceholder'); if (ph && ph.parentNode) ph.parentNode.removeChild(ph); }
  function scrollChatBottom() { var b = chatBox(); if (b) b.scrollTop = b.scrollHeight; }

  // 追加一条气泡（me/ai）；返回 .bub 节点（供流式增量更新）。streaming=true 加流式光标。
  //   imgs（可选）= 该消息所附截图 data URL 数组（我方气泡显自己贴了什么；恢复草稿/会话时也回显）。
  function appendBubble(who, text, streaming, imgs) {
    clearPlaceholder();
    var box = chatBox(); if (!box) return null;
    var msg = document.createElement('div');
    msg.className = 'f-msg ' + (who === 'me' ? 'me' : 'ai');
    var av = document.createElement('div'); av.className = 'av';
    av.textContent = who === 'me' ? ((state.me && (state.me.name || state.me.username) || '我').slice(0, 1)) : 'AI';
    var bub = document.createElement('div'); bub.className = 'bub' + (streaming ? ' streaming' : '');
    bub.innerHTML = md(text || '');
    if (Array.isArray(imgs) && imgs.length) bub.appendChild(bubbleImgs(imgs));   // 气泡内附截图缩略图（点开原图）
    msg.appendChild(av); msg.appendChild(bub);
    box.appendChild(msg); scrollChatBottom();
    return bub;
  }
  // 构造气泡内的截图缩略图区（点击在新标签看原图）；imgs = data URL 数组。
  function bubbleImgs(imgs) {
    var wrap = document.createElement('div'); wrap.className = 'f-bub-imgs';
    imgs.forEach(function (du) {
      var a = document.createElement('a'); a.href = du; a.target = '_blank'; a.rel = 'noopener';
      var im = document.createElement('img'); im.src = du; im.loading = 'lazy';
      a.appendChild(im); wrap.appendChild(a);
    });
    return wrap;
  }

  // ---------- 截图附件：选图 / 粘贴 / 压缩 / 预览 / 清空（本次输入态） ----------
  // 把一批 File（选图或粘贴的图片）读成 data URL 加入 pendingImages（超 6 张提示；单张压缩防炸 MAX_BODY 30MB）。
  function addImageFiles(files) {
    var list = Array.prototype.slice.call(files || []).filter(function (f) { return f && /^image\//.test(f.type); });
    if (!list.length) return;
    var room = IMG_MAX - pendingImages.length;
    if (room <= 0) { appendBubble('ai', '最多只能附 ' + IMG_MAX + ' 张截图，请先删掉几张再添加。'); return; }
    if (list.length > room) { appendBubble('ai', '最多只能附 ' + IMG_MAX + ' 张截图，已保留前 ' + room + ' 张。'); list = list.slice(0, room); }
    list.forEach(function (f) {
      compressImage(f, function (du) { if (du && pendingImages.length < IMG_MAX) { pendingImages.push(du); renderImgPreview(); } });
    });
  }
  // 压缩：缩到 ≤1600px 宽再 toDataURL('image/jpeg',0.85)（防单张过大炸 30MB 上限）；失败/无 canvas 回退原始 data URL。
  function compressImage(file, cb) {
    var fr = new FileReader();
    fr.onload = function () {
      var raw = fr.result;
      try {
        var img = new Image();
        img.onload = function () {
          try {
            var MAXW = 1600, w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
            if (w > MAXW) { h = Math.round(h * MAXW / w); w = MAXW; }
            var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
            var cx = cv.getContext('2d'); cx.drawImage(img, 0, 0, w, h);
            var out = cv.toDataURL('image/jpeg', 0.85);
            cb(out && out.length < raw.length ? out : raw);   // 压完更大就用原图（如小图/已是 jpeg）
          } catch (e) { cb(raw); }
        };
        img.onerror = function () { cb(raw); };
        img.src = raw;
      } catch (e) { cb(raw); }
    };
    fr.onerror = function () { cb(null); };
    fr.readAsDataURL(file);
  }
  // 渲染输入框上方缩略图预览（每张带删除 ×）；无图时隐藏预览条。
  function renderImgPreview() {
    var box = $('fImgPreview'); if (!box) return;
    box.classList.toggle('on', pendingImages.length > 0);
    box.innerHTML = '';
    pendingImages.forEach(function (du, i) {
      var t = document.createElement('div'); t.className = 'thumb';
      var im = document.createElement('img'); im.src = du;
      var rm = document.createElement('button'); rm.type = 'button'; rm.className = 'rm'; rm.textContent = '×'; rm.title = '删除';
      rm.addEventListener('click', function () { pendingImages.splice(i, 1); renderImgPreview(); });
      t.appendChild(im); t.appendChild(rm); box.appendChild(t);
    });
  }
  // 清空待发送截图（每次发送后调；不落草稿/快照）。
  function clearPendingImages() { pendingImages = []; renderImgPreview(); }

  // 「正在思考中…」等待期动效：AI 气泡在收到首个 token 前显三点跳动 + 文字（consult 空气泡 + intake 等待期）。
  //   on=true 挂动效（气泡加 .thinking，内容替为占位）；on=false 清动效（去 .thinking，清空占位 innerHTML 交回逐字/整体渲染）。幂等：重复调用安全。
  function setThinking(bub, on) {
    if (!bub) return;
    if (on) {
      if (bub._thinking) return;
      bub.classList.add('thinking');
      bub.innerHTML = '<span class="f-thinking"><span class="dots"><i></i><i></i><i></i></span><span class="txt">正在思考中…</span></span>';
      bub._thinking = true;
    } else {
      if (!bub._thinking) return;
      bub.classList.remove('thinking');
      bub.innerHTML = '';   // 清占位；随后由调用方逐字/整体渲染真实内容
      bub._thinking = false;
    }
  }

  // 归档结果卡片（建单成功 + 可选 AI 初判 analysis）
  function appendArchiveCard(info) {
    clearPlaceholder();
    var box = chatBox(); if (!box) return;
    var wrap = document.createElement('div'); wrap.className = 'f-msg ai';
    var av = document.createElement('div'); av.className = 'av'; av.innerHTML = '<i class="ti ti-check"></i>';
    var card = document.createElement('div'); card.className = 'f-arch'; card.id = 'fArch-' + info.id;
    var typeLabel = info.type === 'bug' ? 'BUG' : '需求';
    var rows = '<div class="rowk"><span>已归档为工单 <b>' + escapeHtml(info.id) + '</b>（' + typeLabel + '）</span></div>' +
      '<div class="rowk">' +
        (info.site ? '<span>现场：<b>' + escapeHtml(info.site) + '</b></span>' : '') +
        (info.subsystem ? '<span>· 子系统：<b>' + escapeHtml(info.subsystem) + '</b></span>' : '') +
        (info.version ? '<span>· 版本：<b>' + escapeHtml(info.version) + '</b></span>' : '') +
      '</div>';
    card.innerHTML = '<div class="hd"><i class="ti ti-clipboard-check"></i> 已建单，进入运营端工单流</div>' + rows +
      '<div class="anz" id="fAnz-' + info.id + '" style="display:none"></div>';
    var msg = document.createElement('div'); msg.className = 'f-msg ai';
    msg.appendChild(av); msg.appendChild(card);
    box.appendChild(msg); scrollChatBottom();
  }

  // AI 版本感知初判（intake-analyze，建单后即时展示 · NH-3）。未配模型/越权/失败 → 静默不展示（不阻断）。
  function showAnalyze(archive, savedId) {
    if (!savedId || chat.analyzed) return;
    chat.analyzed = true;
    api('/api/intake-analyze', { method: 'POST', body: JSON.stringify({ project: archive.project, id: savedId }) })
      .then(function (r) {
        var b = r.body || {};
        if (!b.ok || !b.analysis) return;   // 未配模型/无解析 → 不展示（AC 兜底：不阻断）
        var el = $('fAnz-' + savedId); if (!el) return;
        var a = b.analysis;
        var catTxt = a.category || '';
        var verdict = a.verdict || '';
        var sugg = a.suggestion === 'file' ? '建议立项开发' : a.suggestion === 'reply' ? '建议直接答复' : (a.suggestion || '');
        el.innerHTML = '<span class="cat">AI 初判</span>' +
          (catTxt ? '<b>' + escapeHtml(catTxt) + '</b> ' : '') +
          (verdict ? escapeHtml(verdict) : '') +
          (sugg ? '<br><span style="color:var(--color-text-tertiary)">处理建议：' + escapeHtml(sugg) + '</span>' : '') +
          (a.detail ? '<br>' + md(String(a.detail).slice(0, 400)) : '');
        el.style.display = 'block';
        scrollChatBottom();
      })
      .catch(function () {});
  }

  // ---------- 发送（对话主流程） ----------
  function sendChat() {
    if (chat.sending) return;
    var input = $('fChatInput'); if (!input) return;
    var text = input.value.trim();
    if (!text && !pendingImages.length) return;   // 空文本 + 无图 → 不发
    if (!state.curSite && state.mode === 'hosp' && !state.sites.length) {   // 无分配医院 → 不发（服务端也会收敛掉）
      appendBubble('ai', '你还没有被分配负责医院，暂时无法提交。请联系运营端为你分配医院后再试。');
      return;
    }
    // 咨询必选子系统（2026-07-23 裁决）：新咨询若归档上下文无子系统（全部系统/全部子项目）→ 拦住并引导选择；不清空输入以便选完再发。
    //   仅 consult 生效；reopen 续聊带 reopenSubsystem 不被拦；提需求/报BUG（intake）走 AI 自动判子系统、不强制手选。
    if (chat.submitKind === 'consult' && guardConsultSubsystem()) return;
    var imgs = pendingImages.slice();   // 本轮附的截图（发出后即清空输入态，不进草稿/快照）
    clearPendingImages();
    input.value = '';
    saveDraft();
    appendBubble('me', text || '（截图）', false, imgs);   // 我方气泡显文本 + 所附截图缩略图
    chat.messages.push({ role: 'user', content: text || '（截图）' });
    chat.lastQ = text;
    setSending(true);
    if (chat.submitKind === 'consult') sendConsult(imgs);
    // 安全续聊（杜绝重单）：reopen 的已建单（intake 模式 + savedId + 锁定的工单 project）→ 走 intake-reply append 同一张单，绝不走 intake-chat 再建新单。
    else if (chat.savedId && chat.reopenIntakeProject) sendIntakeReply(text);
    else sendIntake(imgs);
  }

  function setSending(on) {
    chat.sending = on;
    var btn = $('fChatSend'); if (btn) btn.disabled = on;
  }

  // 提需求 / 报BUG → intake-chat（合并模式，AI 判需求/BUG + 边聊边补，够了输出 record 自动建单）。imgs=本轮附的截图（多模态 + 建单存图）。
  function sendIntake(imgs) {
    var archive = currentArchive();
    var thinking = appendBubble('ai', '', true);
    setThinking(thinking, true);   // intake 也是「等待期空气泡」（非流式，等整体回复）→ 同款思考动效，回复到达即清（下方 finish 分支 setThinking(...,false)）
    api('/api/intake-chat', {
      method: 'POST',
      body: JSON.stringify({
        project: archive.project, type: 'intake', version: archive.version,
        site: archive.site, subsystem: archive.subsystem, messages: chat.messages,
        images: (Array.isArray(imgs) && imgs.length) ? imgs : undefined   // 附图 → 后端多模态看图 + 建 record 时落 media
      })
    }).then(function (r) {
      setSending(false);
      var b = r.body || {};
      var reply = b.reply || '（未收到回复）';
      if (thinking) { setThinking(thinking, false); thinking.classList.remove('streaming'); thinking.innerHTML = md(reply); }
      chat.messages.push({ role: 'assistant', content: reply });
      chat.lastA = reply;
      // AC-11/12/22：AI 产出 record 且服务端建单 → savedId 非空；同会话已建单则不重复建
      if (b.savedId && !chat.savedId) {
        chat.savedId = b.savedId;
        var info = { id: b.savedId, type: (archive._recType || ''), site: archive.site, subsystem: archive.subsystem, version: archive.version };
        // 建单后回读类型：从 intake-list 拿不划算，直接据 chip 展示；type 由 analyze 卡补充。默认按当前视图无法判 req/bug → 用中性展示
        appendArchiveCard({ id: b.savedId, type: info.type, site: archive.site, subsystem: archive.subsystem, version: archive.version });
        showAnalyze(archive, b.savedId);   // NH-3：建单后即时 AI 初判
        refreshLeftList();                 // 建单后刷新左侧提交清单（可回链）
      }
      scrollChatBottom();
      saveDraft();
    }).catch(function () {
      setSending(false);
      if (thinking) { setThinking(thinking, false); thinking.classList.remove('streaming'); thinking.innerHTML = md('（网络异常，请稍后重试）'); }
      // AI/网络不可用 → 展示人工兜底面板（AC-14），不阻断
      offerFallback();
    });
  }

  // 安全续聊：reopen 的已建工单再发言 → intake-reply（把补充 append 到同一张单 + AI 继续答），绝不建重单（区别于 sendIntake 的 intake-chat 会再建单）。
  //   入参锁定：project=chat.reopenIntakeProject（reopen 时锁的工单 project）、id=chat.savedId（工单 id）、message=本轮文本。
  function sendIntakeReply(text) {
    var thinking = appendBubble('ai', '', true);
    setThinking(thinking, true);
    api('/api/intake-reply', {
      method: 'POST',
      body: JSON.stringify({ project: chat.reopenIntakeProject, id: chat.savedId, message: text })
    }).then(function (r) {
      setSending(false);
      var b = r.body || {};
      var reply = b.reply || '（未收到回复）';
      if (thinking) { setThinking(thinking, false); thinking.classList.remove('streaming'); thinking.innerHTML = md(reply); }
      chat.messages.push({ role: 'assistant', content: reply });
      chat.lastA = reply;
      scrollChatBottom();
      saveDraft();
    }).catch(function () {
      setSending(false);
      if (thinking) { setThinking(thinking, false); thinking.classList.remove('streaming'); thinking.innerHTML = md('（网络异常，请稍后重试）'); }
    });
  }

  // 咨询必选子系统守卫：新咨询归档上下文无子系统 → 拦住 + 就地气泡引导选择；返回 true 表示拦截（外层 return 不发）。
  //   reopen 续聊（chat.reopenProject 非空）永不拦——续问要 append 到原 consult，且原子系统由 reopenSubsystem 保留。
  function guardConsultSubsystem() {
    if (chat.reopenProject) return false;   // 续聊不拦（保留原子系统、不误建）
    var arch = currentArchive();
    if (arch.subsystem) return false;       // 已有子系统 → 放行
    // 无子系统 → 引导：医院视图展开「全部子项目」下拉；系统视图展开系统下拉去选一个具体系统
    if (state.mode === 'hosp') {
      appendBubble('ai', '发咨询前请先选择这条咨询所属的子系统——已为你展开「子项目」下拉，选一个具体子系统后再发送。');
      var pw = $('fProdWrap'); if (pw) { closeAllMenus(); pw.classList.add('open'); }
    } else {
      appendBubble('ai', '发咨询前请先选择这条咨询所属的子系统——请在顶部「系统」下拉里选一个具体系统（不能停在「全部系统」），再发送。');
      var sc = $('fSysCur'); if (sc && !state.sysOpen) { try { sc.click(); } catch (e) {} }   // 展开系统下拉（点击触发器含面板定位；已展开则不重复点）
    }
    return true;
  }

  // 咨询答疑 → consult（SSE 流式，逐字追加）；结束落 type=consult，不进批次；可沉淀经验库。imgs=本轮附的截图（多模态 + 咨询存图）。
  function sendConsult(imgs) {
    var archive = currentArchive();
    var bub = appendBubble('ai', '', true);
    setThinking(bub, true);   // 等待首个 token 前显「正在思考中…」动效（深入思考更耗时，动效更该有）；首个 o.v/done/停止/错误即清除
    var acc = '';
    var url = '/api/consult';
    var payload = {
      project: archive.project, version: archive.version, site: archive.site,
      subsystem: archive.subsystem, messages: chat.messages, convId: chat.convId || undefined,
      deep: !!chat.deep,   // FS-06：「深入思考」开启 → 后端检索源码更深入分析（默认关走 spec+经验库）
      images: (Array.isArray(imgs) && imgs.length) ? imgs : undefined   // 附图 → 后端多模态看图 + 咨询落 media
    };
    fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
      .then(function (resp) {
        if (!resp.body || !resp.body.getReader) {   // 无流式支持 → 退化为整体读取
          return resp.text().then(function (t) { parseSSEChunk(t, function (o) { if (o.kb) renderKbCite(bub, o.kb); onConsultEvent(o, bub, function (v) { acc += v; }); }); finishConsult(bub, acc); });
        }
        var reader = resp.body.getReader();
        var dec = new TextDecoder();
        var buf = '';
        function pump() {
          return reader.read().then(function (res) {
            if (res.done) { finishConsult(bub, acc); return; }
            buf += dec.decode(res.value, { stream: true });
            var idx;
            while ((idx = buf.indexOf('\n\n')) >= 0) {
              var chunk = buf.slice(0, idx); buf = buf.slice(idx + 2);
              parseSSEChunk(chunk + '\n\n', function (o) {
                if (o.kb) renderKbCite(bub, o.kb);   // FS-06：命中经验库→答复气泡下方渲染「📚 参考经验库」引用区（kb 事件在流式前先到，占位在下方、答复继续逐字流入不受影响）
                if (o.v != null) { setThinking(bub, false); acc += o.v; bub.innerHTML = md(acc); scrollChatBottom(); }   // 首个流式字符到达 → 清思考动效，转正常逐字渲染
                if (o.done) { chat.convId = o.convId || chat.convId; }
              });
            }
            return pump();
          });
        }
        return pump();
      })
      .catch(function () { finishConsult(bub, acc || '（AI 暂时连不上，请稍后重试）'); });
  }

  // 解析一段 SSE 文本（可能含多条 data: 行）
  function parseSSEChunk(text, onObj) {
    String(text || '').split('\n').forEach(function (line) {
      line = line.trim();
      if (line.indexOf('data:') !== 0) return;
      var payload = line.slice(5).trim(); if (!payload) return;
      var o = null; try { o = JSON.parse(payload); } catch { return; }
      if (o) onObj(o);
    });
  }
  function onConsultEvent(o, bub, addAcc) { if (o.kb) renderKbCite(bub, o.kb); if (o.v != null) { setThinking(bub, false); addAcc(o.v); bub.innerHTML = md((bub._acc = (bub._acc || '') + o.v)); } if (o.done) chat.convId = o.convId || chat.convId; }

  // FS-06：在答复气泡所在消息下方插入一个紧凑的「📚 参考经验库(N)」引用区（默认折叠，点开看每条真实「问→答」；答案用 md() 渲染，KB 答案含 markdown）。
  //   幂等：同一 bub 只渲染一次（kb 事件只发一次，但流式重入/退化路径均可能触发，故用 bub._kbCite 兜底）；kb 空则不渲染。
  function renderKbCite(bub, kb) {
    if (!bub || bub._kbCite || !Array.isArray(kb) || !kb.length) return;
    var msg = bub.parentNode; if (!msg || !msg.parentNode) return;   // .f-msg（av + bub）→ 插到它后面，视觉上挂在答复下方
    var wrap = document.createElement('div');
    wrap.className = 'f-kb-cite';
    var hd = document.createElement('div'); hd.className = 'f-kb-cite-hd';
    hd.innerHTML = '<i class="ti ti-book-2"></i><span>参考经验库（' + kb.length + ' 条）</span><i class="ti ti-chevron-right chev"></i>';
    var body = document.createElement('div'); body.className = 'f-kb-cite-body';
    body.innerHTML = kb.map(function (h, i) {
      var meta = [(h.subsystemLabel || h.subsystem || ''), h.module].filter(Boolean).map(escapeHtml).join(' · ');   // 子系统显中文 desc（subsystemLabel）优先，回退英文 name（2026-07-23）
      return '<div class="f-kb-cite-item">' +
        '<div class="q"><span class="num">' + (i + 1) + '.</span><span>' + escapeHtml(String(h.q || '')) + '</span></div>' +
        (meta ? '<div class="meta">' + meta + '</div>' : '') +
        '<div class="a">' + md(String(h.a || '')) + '</div>' +
        '</div>';
    }).join('');
    hd.addEventListener('click', function () { wrap.classList.toggle('open'); });
    wrap.appendChild(hd); wrap.appendChild(body);
    msg.parentNode.insertBefore(wrap, msg.nextSibling);   // 插在答复消息之后
    bub._kbCite = wrap;
    scrollChatBottom();
  }

  function finishConsult(bub, acc) {
    setSending(false);
    if (bub) { setThinking(bub, false); bub.classList.remove('streaming'); if (acc) bub.innerHTML = md(acc); }   // done/停止/错误兜底清思考动效（首个 token 未到就结束时也清）
    var replyText = acc || (bub && bub.textContent) || '';
    if (replyText) { chat.messages.push({ role: 'assistant', content: replyText }); chat.lastA = replyText; }
    // 咨询「已解决 → 沉淀经验库」入口（AC-19-KB）：结束后在气泡下追加一枚小按钮
    if (replyText && chat.lastQ) appendKbSink();
    scrollChatBottom();
    saveDraft();
  }

  // AC-19-KB：咨询「解决了/沉淀经验库」→ kb-from-consult（带 project/q/a）
  function appendKbSink() {
