<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>需求 / BUG 提交 · 收件 intake</title>
<link rel="stylesheet" href="/vendor/tabler/tabler-icons.min.css">
<link rel="stylesheet" href="/assets/app.css">
<script src="/assets/ui.js" defer></script>
<script src="/assets/nav.js" defer></script>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;flex-direction:column;overflow:hidden}
  #app{flex:1;min-height:0;display:flex;flex-direction:column;max-width:1000px;width:100%;margin:0 auto;padding:14px 20px}
  header{display:flex;align-items:center;gap:11px;margin-bottom:12px;flex:0 0 auto}
  header h1{margin:0;font-size:18px;font-weight:700;display:flex;align-items:center;gap:10px}
  header .logo{width:30px;height:30px;border-radius:8px;background:var(--pri-grad);color:#fff;display:grid;place-items:center;font-size:16px}
  header .spacer{flex:1}
  .typetoggle{display:inline-flex;background:var(--alt);border:1px solid var(--line-s);border-radius:8px;padding:2px;gap:2px}
  .tt-opt{border:none;background:transparent;color:var(--sub);font-size:13px;font-weight:600;padding:6px 13px;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:.12s;user-select:none;-webkit-user-select:none}
  .tt-opt.on{background:#fff;box-shadow:var(--sh);color:var(--pri)}
  .consult-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 14px;border-top:1px solid var(--line);background:#F6F4FB;flex:0 0 auto}
  .consult-bar .cb-q{font-size:12.5px;color:var(--sub);font-weight:600}
  .cbtn{border:1px solid var(--line-s);background:#fff;color:var(--sub);font-size:12.5px;font-weight:600;border-radius:var(--r);padding:6px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:.12s}
  .cbtn:hover{border-color:var(--t3);color:var(--t)}
  .cbtn.ok{border-color:#B7DBC5;background:var(--ok-l);color:#1E6B41}.cbtn.ok:hover{background:#dcefe3}
  .locknote{font-size:12px;color:var(--pri);background:var(--pri-light);border:1px solid var(--pri-border);border-radius:var(--r);padding:4px 10px;display:none;align-items:center;gap:5px}
  .locknote.on{display:inline-flex}


  /* ② 对话进件 */
  #work{flex:1;min-height:0;display:flex;flex-direction:column;gap:11px}
  .route-bar{display:flex;align-items:flex-end;gap:12px;background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh);padding:11px 15px;flex:0 0 auto;flex-wrap:nowrap}
  .rb-item{display:flex;flex-direction:column;gap:5px;flex:0 0 auto}
  .rb-item .rb-l{font-size:12px;font-weight:600;color:var(--t)}.rb-item .rb-l .req{color:var(--danger)}
  /* 四个字段统一宽度、整行不换行 */
  .rb-item select,.rb-item input,.rb-item .sel-wrap{width:156px;min-width:0;height:34px;font-size:13px}
  .rb-item .sel-btn{height:34px;min-height:34px;font-size:13px;padding:6px 11px}
  .mine-h .sel-wrap{width:150px;flex:0 0 auto}
  .mine-h .sel-btn{height:32px;min-height:32px;font-size:12.5px;padding:5px 10px}
  .rb-me{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--pri);background:var(--pri-light);border:1px solid var(--pri-border);border-radius:var(--r);padding:7px 11px;height:34px}
  .rb-sp{flex:1}
  .rb-new{height:34px;border:1px solid var(--pri-border);background:var(--pri-light);color:var(--pri);font-size:12.5px;font-weight:600;border-radius:var(--r);padding:0 14px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:.12s;white-space:nowrap}
  .rb-new:hover{background:var(--pri);color:#fff;border-color:var(--pri)}
  .chatwrap{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh);overflow:hidden}
  .cp-body{flex:1;min-height:0;overflow-y:auto;padding:20px;background:var(--alt)}
  .cp-empty{color:var(--sub);text-align:center;padding:50px 26px;font-size:13.5px;line-height:1.9}
  .cp-empty .bigic{font-size:32px;opacity:.5;margin-bottom:8px}
  .msg{display:flex;gap:10px;margin-bottom:16px}
  .msg .av{width:30px;height:30px;border-radius:8px;flex:0 0 auto;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
  .msg.ai .av{background:var(--pri)}.msg.me .av{background:var(--t3)}
  .msg .bubble{border-radius:11px;padding:10px 14px;font-size:14px;white-space:pre-wrap;word-break:break-word;max-width:80%;line-height:1.6}
  .msg.ai .bubble{background:#fff;border:1px solid var(--line);box-shadow:var(--sh)}
  .msg.me{flex-direction:row-reverse}.msg.me .bubble{background:var(--pri);color:#fff}
  .msg.done .bubble{background:var(--ok-l);border:1px solid #B7DBC5;color:#1E6B41;font-weight:600}
  .msg .bubble.md{white-space:normal}
  .bubble.md p{margin:0 0 8px}.bubble.md p:last-child{margin-bottom:0}
  .bubble.md ul,.bubble.md ol{margin:6px 0;padding-left:22px}.bubble.md li{margin:3px 0}
  .bubble.md h1,.bubble.md h2,.bubble.md h3,.bubble.md h4{margin:11px 0 6px;font-weight:700;line-height:1.35}.bubble.md :first-child{margin-top:0}
  .bubble.md h1{font-size:16px}.bubble.md h2{font-size:15px}.bubble.md h3,.bubble.md h4{font-size:14px}
  .bubble.md code{background:#EDF1F6;border-radius:4px;padding:1px 5px;font-family:var(--fe,ui-monospace,monospace);font-size:12.5px}
  .bubble.md pre{background:#0F2744;color:#E6EDF5;border-radius:8px;padding:10px 12px;overflow-x:auto;margin:8px 0}
  .bubble.md pre code{background:none;color:inherit;padding:0}
  .bubble.md blockquote{margin:6px 0;padding:3px 12px;border-left:3px solid var(--line);color:var(--sub)}
  .bubble.md hr{border:none;border-top:1px solid var(--line);margin:11px 0}
  .bubble.md a{color:var(--pri);text-decoration:underline}.bubble.md strong{font-weight:700}
  .typing-dots{display:inline-flex;gap:5px;align-items:center;height:18px;padding:2px 0}
  .typing-dots i{width:7px;height:7px;border-radius:50%;background:var(--pri);opacity:.4;animation:td 1.2s infinite ease-in-out}
  .typing-dots i:nth-child(2){animation-delay:.18s}.typing-dots i:nth-child(3){animation-delay:.36s}
  @keyframes td{0%,65%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
  .cp-foot{padding:11px 14px;border-top:1px solid var(--line);display:flex;gap:9px;flex:0 0 auto;background:#fff}
  .cp-foot textarea{min-height:42px;max-height:130px;resize:none}
  .cp-foot .send{border:none;border-radius:var(--r);background:var(--pri-grad);color:#fff;font-weight:600;padding:0 22px;cursor:pointer;min-width:64px}.cp-foot .send:disabled{opacity:.5;cursor:default}
  .cp-foot .send.stopping{background:var(--danger)}
  .cp-foot .attach{width:42px;flex:0 0 auto;display:grid;place-items:center;border:1px solid var(--line-s);border-radius:var(--r);color:var(--sub);cursor:pointer;font-size:18px;transition:.12s}
  .cp-foot .attach:hover{border-color:var(--pri-border);color:var(--pri)}
  .thumbs{display:flex;flex-wrap:wrap;gap:8px;padding:8px 14px 0;flex:0 0 auto}
  .thumbs:empty{display:none}
  .thumb{width:54px;height:54px;border-radius:var(--r);position:relative;overflow:hidden;border:1px solid var(--line);background:var(--alt)}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .thumb .del{position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:rgba(15,39,68,.62);color:#fff;font-size:11px;display:grid;place-items:center;cursor:pointer;line-height:1}

  /* 我的提交抽屉 */
  .hbtn{font-size:13px}
  .mask{position:fixed;inset:0;background:rgba(15,39,68,.3);z-index:40;display:none}.mask.on{display:block}
  .mine{position:fixed;top:0;right:0;bottom:0;width:min(420px,92vw);background:#fff;box-shadow:-8px 0 30px rgba(15,39,68,.16);z-index:41;transform:translateX(102%);transition:transform .22s;display:flex;flex-direction:column}.mine.on{transform:translateX(0)}
  .mine-h{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700;font-size:15px;display:flex;align-items:center;gap:9px}.mine-h .spacer{flex:1}.mine-h .x{cursor:pointer;color:var(--t3);font-size:20px}.mine-h select{width:150px;height:32px;font-size:12.5px}
  .mine-list{flex:1;overflow-y:auto;padding:6px 0}
  .mrow{padding:11px 18px;border-bottom:1px solid var(--line)}
  .mrow .l1{display:flex;align-items:center;gap:8px;margin-bottom:3px}.mrow .title{font-weight:600;font-size:13.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mrow .l2{font-size:12px;color:var(--sub);display:flex;gap:9px;flex-wrap:wrap}

  /* 中等及以下宽度：整行放不下就允许换行，字段自适应收窄，避免横向溢出 */
  @media(max-width:1180px){
    .route-bar{flex-wrap:wrap}
    .rb-item{flex:1 1 150px}
    .rb-item select,.rb-item input,.rb-item .sel-wrap{width:100%;min-width:130px}
  }
  @media(max-width:820px){
    html,body{height:auto;overflow:auto}
    #app{height:auto;min-height:100dvh;padding:12px 14px}
    #work{min-height:0}
    .chatwrap{min-height:420px}
    .rb-item select,.rb-item input,.rb-item .sel-wrap{min-width:120px}
    header{flex-wrap:wrap;gap:8px}
  }
</style>
</head>
<body>
<nav class="topnav">
  <div class="brand"><span class="logo"><i class="ti ti-clipboard-check"></i></span> 收件 <span>intake</span></div>
  <a href="/console.html"><i class="ti ti-layout-dashboard"></i> <span class="txt">工作台</span></a>
  <a href="/submit.html" class="on"><i class="ti ti-pencil-plus"></i> <span class="txt">提交</span></a>
  <a href="/inbox.html"><i class="ti ti-inbox"></i> <span class="txt">收件箱</span></a>
  <a href="/projects.html"><i class="ti ti-folders"></i> <span class="txt">产品管理</span></a>
  <a href="/model-config.html"><i class="ti ti-key"></i> <span class="txt">模型配置</span></a>
</nav>
<div id="app">
  <header>
    <h1><span class="logo"><i class="ti ti-clipboard-text"></i></span> 需求 / BUG 提交</h1>
    <span class="locknote" id="lockNote"><i class="ti ti-lock"></i> 链接已锁定类型</span>
    <div class="spacer"></div>
    <div class="typetoggle" id="typeToggle">
      <button class="tt-opt on" data-type="intake"><i class="ti ti-clipboard-plus"></i> 提需求 / 报 BUG</button>
      <button class="tt-opt" data-type="consult"><i class="ti ti-help-circle"></i> 咨询答疑</button>
    </div>
    <button class="hbtn" id="mineBtn"><i class="ti ti-inbox"></i> 我的提交</button>
  </header>

  <!-- 对话进件（进来即是） -->
  <div id="work">
    <div class="route-bar">
      <div class="rb-item"><span class="rb-l">所属系统<span class="req">*</span></span><select id="mProject" class="fancy"></select></div>
      <div class="rb-item" id="subItem"><span class="rb-l">子系统</span><select id="mSubsystem" class="fancy"><option value="">全部子系统</option></select></div>
      <div class="rb-item"><span class="rb-l">产品版本</span><select id="mVersion" class="fancy"><option value="">先选所属系统</option></select></div>
      <div class="rb-item"><span class="rb-l">现场 / 客户</span><select id="mSite" class="fancy"><option value="">不指定</option></select></div>
      <div class="rb-sp"></div>
      <button class="rb-new" id="newChatBtn" title="清空当前对话，开始新的一条"><i class="ti ti-plus"></i> 新对话</button>
      <div class="rb-me"><i class="ti ti-user-circle"></i> <span id="meName">登录人</span></div>
    </div>
    <div class="chatwrap">
      <div class="cp-body" id="chatBody">
        <div class="cp-empty" id="chatEmpty"><div class="bigic"><i class="ti ti-message-2"></i></div>先在上方选「所属系统」，然后<br>直接把你的需求 / 问题说给 AI 听即可。</div>
      </div>
      <div class="consult-bar" id="consultBar" style="display:none">
        <span class="cb-q">这条帮你解决了吗？</span>
        <button class="cbtn" id="deepBtn" title="答得不够时，让 AI 结合系统实现深入思考再答一次"><i class="ti ti-bulb"></i> 深入思考</button>
        <button class="cbtn ok" id="kbSaveBtn"><i class="ti ti-bookmark-plus"></i> 解决了 · 存入经验库</button>
        <button class="cbtn" id="toIntakeBtn"><i class="ti ti-clipboard-plus"></i> 这是需求 / BUG，转提交</button>
      </div>
      <div class="thumbs" id="thumbs"></div>
      <div class="cp-foot">
        <label class="attach" id="attachBtn" title="添加截图"><i class="ti ti-photo-plus"></i><input type="file" id="imgInput" accept="image/*" multiple hidden></label>
        <textarea id="chatInput" placeholder="先选所属系统…" disabled></textarea>
        <button class="send" id="chatSend" disabled>发送</button>
      </div>
    </div>
  </div>
</div>

<div class="mask" id="mask"></div>
<div class="mine" id="minePanel">
  <div class="mine-h"><i class="ti ti-inbox"></i> 我的提交<div class="spacer"></div><select id="fProject" class="fancy"></select><span class="x" id="mineX">×</span></div>
  <div class="mine-list" id="mineList"></div>
</div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
let PROJECTS=[], ME=null, ftype='requirement';
let messages=[], started=false, sending=false, images=[], convId='';
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2400);}
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function val(id){return $(id).value.trim();}

/* 类型切换（右上角） */
function setType(t,skipReset){ ftype=t; [...document.querySelectorAll('#typeToggle .tt-opt')].forEach(o=>o.classList.toggle('on',o.dataset.type===t)); if(!skipReset) resetChat(); }
$('#typeToggle').addEventListener('click',async e=>{ const o=e.target.closest('.tt-opt'); if(!o||o.dataset.type===ftype)return;
  if(messages.length && !(await uiConfirm('切换类型会清空当前对话，确定继续？'))) return; setType(o.dataset.type); });

/* 项目/版本/模块 */
async function loadProjects(){ try{ const r=await (await fetch('/api/projects')).json(); PROJECTS=r.projects||[]; }catch(e){}
  $('#mProject').innerHTML='<option value="">请选择</option>'+PROJECTS.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');
  $('#fProject').innerHTML='<option value="">全部项目</option>'+PROJECTS.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join(''); }
// 产品版本 = 各子系统仓 git tag 的下拉；keepVer 传入需保留/预填的版本（不在 tag 里则加「手填」项兜底）
async function loadVersions(pid, keepVer){
  const sel=$('#mVersion');
  if(!pid){ sel.innerHTML='<option value="">先选所属系统</option>'; return; }
  sel.innerHTML='<option value="">读取版本中…</option>';
  let versions=[]; try{ const r=await (await fetch('/api/versions?project='+encodeURIComponent(pid))).json(); versions=r.versions||[]; }catch(e){}
  const kv=(keepVer!=null?keepVer:sel.value)||'', has=new Set(versions);
  let opts='<option value="">'+(versions.length?'不指定版本':'（该系统暂无版本 · 未打 tag）')+'</option>';
  opts+=versions.map(v=>`<option value="${esc(v)}"${v===kv?' selected':''}>${esc(v)}</option>`).join('');
  if(kv && !has.has(kv)) opts+=`<option value="${esc(kv)}" selected>${esc(kv)}（手填）</option>`;
  sel.innerHTML=opts; sel.value=kv;
}
// 子系统下拉：始终显示（选中后检索/归档收窄到该子系统，value=子系统名，显示优先中文描述 desc）
function loadSubsystems(pid, keepSub){
  const sel=$('#mSubsystem');
  const p=PROJECTS.find(x=>x.id===pid);
  const subs=((p&&p.subsystems)||[]).map(s=>typeof s==='string'?{name:s,desc:''}:{name:(s&&s.name)||'',desc:(s&&s.desc)||''}).filter(s=>s.name);
  const kv=keepSub||'';
  sel.innerHTML='<option value="">全部子系统</option>'+subs.map(s=>{ const label=s.desc?`${s.desc}（${s.name}）`:s.name; return `<option value="${esc(s.name)}"${s.name===kv?' selected':''}>${esc(label)}</option>`; }).join('');
  sel.value=kv;
}
$('#mProject').addEventListener('change',async()=>{ const pid=$('#mProject').value; loadSubsystems(pid,''); await loadVersions(pid, custVerMap[pid]||''); enableChatIfReady(); });

// 客户台账：现场/客户下拉；选客户自动带出它用的产品 + 版本
let CUSTOMERS=[], custVerMap={};
async function loadCustomersList(){
  try{ CUSTOMERS=(await (await fetch('/api/customers')).json()).customers||[]; }catch(e){ CUSTOMERS=[]; }
  $('#mSite').innerHTML='<option value="">不指定</option>'+CUSTOMERS.map(c=>`<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('');
}
function setSiteVal(v){ const sel=$('#mSite'); if(v && !Array.from(sel.options).some(o=>o.value===v)){ const o=document.createElement('option'); o.value=v; o.textContent=v; sel.appendChild(o); } sel.value=v||''; }
$('#mSite').addEventListener('change',async()=>{
  const c=CUSTOMERS.find(x=>x.name===$('#mSite').value); custVerMap={};
  if(c&&c.products) c.products.forEach(pr=>{ if(pr.project) custVerMap[pr.project]=pr.version||''; });
  const first=c&&c.products&&c.products[0];
  if(first&&first.project&&PROJECTS.some(p=>p.id===first.project)){
    $('#mProject').value=first.project; loadSubsystems(first.project,'');
    await loadVersions(first.project, custVerMap[first.project]||''); enableChatIfReady();
  }
});

/* 对话 */
const GREET={ intake:'你好！直接说说你想要的功能 / 改进，或者遇到的问题都行——我来判断是需求还是 BUG，帮你按标准理清楚、整理好归档。', requirement:'你好！请直接说说你想要的功能或改进——想解决什么、达到什么效果？我来帮你按标准理清楚、整理好。', bug:'你好！请直接说说你遇到的问题——哪个页面、做了什么操作后出现了什么异常？我来帮你按标准理清楚。', consult:'你好！有系统使用/操作上的问题，直接问我就行，我结合系统说明和过往经验帮你解答、给解决思路。' };
const PH={ intake:'说说想要的功能改进，或遇到的问题…回车发送', requirement:'说说你想要的功能、想解决什么…回车发送', bug:'说说哪个页面、什么操作后出了什么问题…回车发送', consult:'直接问系统怎么用/为什么会这样…回车发送' };
function resetChat(){ messages=[]; started=false; images=[]; convId=''; renderThumbs(); $('#consultBar').style.display='none'; $('#chatBody').innerHTML='<div class="cp-empty" id="chatEmpty"><div class="bigic"><i class="ti ti-message-2"></i></div>先在上方选「所属系统」，然后<br>'+(ftype==='consult'?'直接把系统问题问给 AI 即可。':'直接把你的需求 / 问题说给 AI 听即可。')+'</div>'; enableChatIfReady(); }
function enableChatIfReady(){ const ok=!!$('#mProject').value; $('#chatInput').disabled=!ok; $('#chatSend').disabled=!ok;
  $('#chatInput').placeholder = ok ? PH[ftype] : '先选所属系统…';
  if(ok && !started){ started=true; $('#chatEmpty')&&$('#chatEmpty').remove(); addAI(GREET[ftype]); } }
// 轻量 markdown 渲染（先转义再解析，安全）：标题/列表/引用/代码/粗斜体/链接/分隔线
function mdToHtml(src){
  const blocks=[];
  src=String(src==null?'':src).replace(/```[a-zA-Z0-9]*\n?([\s\S]*?)```/g,(m,c)=>{blocks.push(c.replace(/\n$/,''));return 'CODE'+(blocks.length-1)+'';});
  const inline=t=>{
    t=esc(t);
    t=t.replace(/`([^`]+)`/g,(m,c)=>'<code>'+c+'</code>');
    t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/__([^_]+)__/g,'<strong>$1</strong>');
    t=t.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,'$1<em>$2</em>');
    t=t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    return t;
  };
  const cbRe=/^CODE(\d+)$/;
  const L=src.split('\n'); let h='',i=0;
  const isBreak=s=>/^\s*$/.test(s)||/^\s*#{1,4}\s/.test(s)||/^\s*[-*+]\s+/.test(s)||/^\s*\d+[.、)]\s+/.test(s)||/^\s*>\s?/.test(s)||cbRe.test(s)||/^\s*([-*_])\1\1+\s*$/.test(s);
  while(i<L.length){
    const ln=L[i]; const cb=ln.match(cbRe);
    if(cb){ h+='<pre><code>'+esc(blocks[+cb[1]])+'</code></pre>'; i++; continue; }
    if(/^\s*$/.test(ln)){ i++; continue; }
    if(/^\s*([-*_])\1\1+\s*$/.test(ln)){ h+='<hr>'; i++; continue; }
    const hm=ln.match(/^\s*(#{1,4})\s+(.*)$/); if(hm){ const lv=hm[1].length; h+='<h'+lv+'>'+inline(hm[2])+'</h'+lv+'>'; i++; continue; }
    if(/^\s*>\s?/.test(ln)){ const b=[]; while(i<L.length&&/^\s*>\s?/.test(L[i])){ b.push(L[i].replace(/^\s*>\s?/,'')); i++; } h+='<blockquote>'+b.map(inline).join('<br>')+'</blockquote>'; continue; }
    if(/^\s*[-*+]\s+/.test(ln)){ h+='<ul>'; while(i<L.length&&/^\s*[-*+]\s+/.test(L[i])){ h+='<li>'+inline(L[i].replace(/^\s*[-*+]\s+/,''))+'</li>'; i++; } h+='</ul>'; continue; }
    if(/^\s*\d+[.、)]\s+/.test(ln)){ h+='<ol>'; while(i<L.length&&/^\s*\d+[.、)]\s+/.test(L[i])){ h+='<li>'+inline(L[i].replace(/^\s*\d+[.、)]\s+/,''))+'</li>'; i++; } h+='</ol>'; continue; }
    const b=[]; while(i<L.length&&!isBreak(L[i])){ b.push(L[i]); i++; } h+='<p>'+b.map(inline).join('<br>')+'</p>';
  }
  return h;
}
function addAI(text,done){ const d=document.createElement('div'); d.className='msg ai'+(done?' done':''); d.innerHTML=`<div class="av">AI</div><div class="bubble md">${mdToHtml(text)}</div>`; $('#chatBody').appendChild(d); $('#chatBody').scrollTop=$('#chatBody').scrollHeight; }
function addMe(text){ const d=document.createElement('div'); d.className='msg me'; d.innerHTML=`<div class="av">我</div><div class="bubble">${esc(text)}</div>`; $('#chatBody').appendChild(d); $('#chatBody').scrollTop=$('#chatBody').scrollHeight; }
let chatAbort=null;
function setSendBtn(mode){ const b=$('#chatSend'); if(mode==='stop'){ b.textContent='停止'; b.classList.add('stopping'); b.disabled=false; } else { b.textContent='发送'; b.classList.remove('stopping'); b.disabled=!$('#mProject').value; } }
function stopChat(){ if(chatAbort){ try{ chatAbort.abort(); }catch(e){} } }
async function sendChat(){ const t=$('#chatInput').value.trim(); if(!t)return; $('#chatInput').value=''; return runChat(t,{}); }
async function deepDive(){ if(ftype!=='consult'||sending)return; return runChat('深入思考一下上面的问题（结合系统实现再详细讲讲）',{deep:true}); }
async function runChat(t,opt){ if(sending)return; if(!$('#mProject').value)return toast('请先选所属系统');
  addMe(t); messages.push({role:'user',content:t}); sending=true; $('#consultBar').style.display='none'; setSendBtn('stop');
  const typing=document.createElement('div'); typing.className='msg ai'; typing.id='typing'; typing.innerHTML='<div class="av">AI</div><div class="bubble"><span class="typing-dots"><i></i><i></i><i></i></span>'+(opt.deep?'<span style="color:var(--t3);font-size:12.5px;margin-left:8px">深入思考中（读源码）…</span>':'')+'</div>'; $('#chatBody').appendChild(typing); $('#chatBody').scrollTop=$('#chatBody').scrollHeight;
  const payload={project:$('#mProject').value,type:ftype,subsystem:$('#mSubsystem').value,version:val('#mVersion'),site:val('#mSite'),messages,convId}; if(opt.deep)payload.deep=true; if(ftype!=='consult'&&images.length) payload.images=images.slice();
  chatAbort=new AbortController();
  try{ if(ftype==='consult') await streamConsult(payload); else await sendIntake(payload); }
  catch(e){ $('#typing')&&$('#typing').remove(); if(e.name!=='AbortError') toast('发送失败：'+e.message); }
  finally{ sending=false; chatAbort=null; setSendBtn('send'); }
}
$('#deepBtn').addEventListener('click',deepDive);
// 答疑：SSE 流式，边收边渲染 markdown；停止=保留已生成的部分
async function streamConsult(payload){
  const r=await fetch('/api/consult',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:chatAbort.signal});
  $('#typing')&&$('#typing').remove();
  const d=document.createElement('div'); d.className='msg ai'; d.innerHTML='<div class="av">AI</div><div class="bubble md"></div>'; $('#chatBody').appendChild(d); const bub=d.querySelector('.bubble');
  const reader=r.body.getReader(), dec=new TextDecoder(); let buf='', full='';
  try{ for(;;){ const {done,value}=await reader.read(); if(done)break; buf+=dec.decode(value,{stream:true});
      let i; while((i=buf.indexOf('\n\n'))>=0){ const dl=buf.slice(0,i).split('\n').find(l=>l.startsWith('data:')); buf=buf.slice(i+2);
        if(!dl)continue; let o; try{o=JSON.parse(dl.slice(5).trim());}catch{continue;}
        if(o.v){ full+=o.v; bub.innerHTML=mdToHtml(full); $('#chatBody').scrollTop=$('#chatBody').scrollHeight; }
        if(o.convId) convId=o.convId;
      } } }
  catch(e){ if(e.name!=='AbortError') throw e; }
  if(!full) bub.innerHTML='<span style="color:var(--t3)">（无回复）</span>';
  messages.push({role:'assistant',content:full||'（无回复）'});
  $('#consultBar').style.display= full ? 'flex' : 'none';
}
// 进件（需求/BUG）：非流式（末尾有归档块要处理）
async function sendIntake(payload){
  const r=await (await fetch('/api/intake-chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:chatAbort.signal})).json();
  $('#typing')&&$('#typing').remove();
  const reply=r.reply||'（无回复）'; messages.push({role:'assistant',content:reply}); addAI(reply);
  if(r.convId) convId=r.convId;
  if(r.savedId){ addAI('已按标准整理并提交，编号 '+r.savedId+'，开发会尽快处理。你可在右上「我的提交」查看进展。',true); toast('已提交 '+r.savedId); images=[]; renderThumbs(); loadMine($('#fProject').value||$('#mProject').value); }
}
$('#chatSend').addEventListener('click',()=>{ if(sending) stopChat(); else sendChat(); });
$('#newChatBtn').addEventListener('click',async()=>{ if(sending)return; if(messages.length && !(await uiConfirm('清空当前对话，开始新的一条？'))) return; resetChat(); $('#chatInput').focus(); });
$('#chatInput').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendChat(); } });
/* 截图 */
$('#imgInput').addEventListener('change',async e=>{ for(const file of [...e.target.files]){ if(images.length>=6){toast('最多 6 张');break;} try{ images.push(await compress(file)); }catch(err){} } e.target.value=''; renderThumbs(); });
function compress(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=1280;let{width:w,height:h}=img;if(w>max||h>max){const k=Math.min(max/w,max/h);w=w*k|0;h=h*k|0;}const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);res(cv.toDataURL('image/jpeg',0.7));};img.onerror=rej;img.src=r.result;};r.onerror=rej;r.readAsDataURL(file);});}
function renderThumbs(){ $('#thumbs').innerHTML=images.map((src,i)=>`<div class="thumb"><img src="${src}"><span class="del" data-i="${i}">×</span></div>`).join(''); }
$('#thumbs').addEventListener('click',e=>{ if(e.target.dataset.i!=null){ images.splice(+e.target.dataset.i,1); renderThumbs(); } });
/* 答疑动作：解决了存经验库 / 转工单 */
function firstUserQ(){ const m=messages.find(x=>x.role==='user'); return m?m.content:''; }
function lastAIAns(){ for(let i=messages.length-1;i>=0;i--) if(messages[i].role==='assistant') return messages[i].content; return ''; }
$('#kbSaveBtn').addEventListener('click',async()=>{ const q=firstUserQ(), a=lastAIAns(); if(!q||!a)return;
  try{ const r=await (await fetch('/api/kb-from-consult',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project:$('#mProject').value,q,a})})).json();
    if(r.ok){ toast('已存入经验库，下次同类问题答得更准'); $('#consultBar').style.display='none'; } else toast(r.error||'存入失败'); }catch(e){ toast('存入失败：'+e.message); } });
function convertTo(t){ ftype=t; [...document.querySelectorAll('#typeToggle .tt-opt')].forEach(o=>o.classList.toggle('on',o.dataset.type===t)); $('#consultBar').style.display='none';
  addAI('好的，我把它当作需求 / BUG 来处理——你继续说，我判断是需求还是缺陷，按标准帮你理清楚并归档。'); toast('已转为 需求 / BUG 提交'); }
$('#toIntakeBtn').addEventListener('click',()=>convertTo('intake'));

/* 我的提交 */
function openMine(){ $('#mask').classList.add('on'); $('#minePanel').classList.add('on'); loadMine($('#fProject').value||$('#mProject').value); }
function closeMine(){ $('#mask').classList.remove('on'); $('#minePanel').classList.remove('on'); }
$('#mineBtn').addEventListener('click',openMine); $('#mineX').addEventListener('click',closeMine); $('#mask').addEventListener('click',closeMine);
$('#fProject').addEventListener('change',()=>loadMine($('#fProject').value));
async function loadMine(pid){
  const el=$('#mineList'); el.innerHTML='<div class="mrow" style="color:#98A1AD">加载中…</div>';
  const pmap={}; (PROJECTS||[]).forEach(p=>pmap[p.id]=p.name);
  let items=[];
  try{
    if(pid){ const r=await (await fetch('/api/intake-list?project='+encodeURIComponent(pid)+'&withConsult=1')).json(); items=(r.items||[]).map(i=>({...i,_pid:pid})); }
    else{ // 全部项目：并发取各项目再合并（按最近活跃排序）
      const lists=await Promise.all((PROJECTS||[]).map(async p=>{ try{ const r=await (await fetch('/api/intake-list?project='+encodeURIComponent(p.id)+'&withConsult=1')).json(); return (r.items||[]).map(i=>({...i,_pid:p.id})); }catch{ return []; } }));
      items=lists.flat().sort((a,b)=>(b.updatedAt||b.submittedAt||'').localeCompare(a.updatedAt||a.submittedAt||'')); }
  }catch(e){}
  if(!items.length){ el.innerHTML='<div class="mrow" style="color:#98A1AD">'+(pid?'该项目暂无提交':'暂无提交记录')+'</div>'; return; }
  el.innerHTML=items.map(i=>{ const isC=i.type==='consult';
    const badge=isC?'<span class="badge" style="background:#EFEAF6;color:#7A5BA6">咨询</span>':`<span class="badge ${i.type==='bug'?'b-bug':'b-req'}">${i.type==='bug'?'BUG':'需求'}</span>`;
    const sys=`<span class="badge" style="background:#EAF2FB;color:#1A6DBE" title="所属系统"><i class="ti ti-folder" style="font-size:12px"></i> ${esc(pmap[i._pid]||i._pid)}</span>`;
    return `<div class="mrow"${isC?` data-consult="${esc(i.id)}" data-pid="${esc(i._pid)}" style="cursor:pointer"`:''}><div class="l1">${badge}${sys}<span class="title">${esc(i.title)}</span></div><div class="l2"><span>${esc(i.lifecycle||i.status||'')}</span>${i.site?`<span><i class="ti ti-map-pin"></i>${esc(i.site)}</span>`:''}${i.version?`<span><i class="ti ti-tag"></i>${esc(i.version)}</span>`:''}<span>${esc(i.id)}</span>${isC?'<span style="color:var(--pri)"><i class="ti ti-arrow-back-up"></i>继续对话</span>':''}</div></div>`; }).join('');
  el.querySelectorAll('[data-consult]').forEach(row=>row.addEventListener('click',()=>resumeConsult(row.getAttribute('data-pid'),row.getAttribute('data-consult'))));
}
async function resumeConsult(pid,id){
  try{ const r=await (await fetch('/api/intake-detail?project='+encodeURIComponent(pid)+'&id='+encodeURIComponent(id))).json(); const e=r.item; if(!e){ toast('找不到该咨询'); return; }
    setType('consult',true); $('#mProject').value=pid; loadSubsystems(pid, e.subsystem||''); await loadVersions(pid, e.version||''); if(e.site) setSiteVal(e.site);
    started=true; convId=e.id; messages=(e.chat||[]).map(m=>({role:m.role==='assistant'?'assistant':'user',content:m.text}));
    $('#chatEmpty')&&$('#chatEmpty').remove(); $('#chatBody').innerHTML='';
    (e.chat||[]).forEach(m=>{ if(m.role==='assistant') addAI(m.text); else addMe(m.text); });
    $('#consultBar').style.display='flex'; enableChatIfReady(); closeMine();
  }catch(err){ toast('打开失败：'+err.message); }
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape')closeMine(); });

/* 链接预填并锁定 ?project=&site=&ver=&type= */
function lockEl(el){ if(el) el.setAttribute('disabled',''); }
async function applyLock(){
  const q=new URLSearchParams(location.search);
  const qp=q.get('project'), qs=q.get('site'), qv=q.get('ver'), qt=q.get('type');
  let locked=false;
  if(qt==='bug'||qt==='requirement'){ setType(qt,true); $('#typeToggle').style.pointerEvents='none'; $('#typeToggle').style.opacity='.6'; locked=true; }
  if(qp && PROJECTS.some(p=>p.id===qp)){ $('#mProject').value=qp; $('#fProject').value=qp; loadSubsystems(qp, q.get('sub')||''); await loadVersions(qp, qv||''); enableChatIfReady(); lockEl($('#mProject')); locked=true; }
  if(qv){ lockEl($('#mVersion')); locked=true; }
  if(qs){ setSiteVal(qs); lockEl($('#mSite')); locked=true; }
  if(locked) $('#lockNote').classList.add('on');
}

/* 提交链接身份：锁定项目/类型/现场，隐藏"我的提交" */
async function applyLinkLock(me){
  if(me.ptype==='bug'||me.ptype==='requirement'||me.ptype==='consult'){ setType(me.ptype,true); $('#typeToggle').style.pointerEvents='none'; $('#typeToggle').style.opacity='.6'; }
  if(me.project && PROJECTS.some(p=>p.id===me.project)){ $('#mProject').value=me.project; loadSubsystems(me.project,''); await loadVersions(me.project, me.ver||''); enableChatIfReady(); lockEl($('#mProject')); }
  if(me.ver){ lockEl($('#mVersion')); }
  if(me.site){ setSiteVal(me.site); lockEl($('#mSite')); }
  $('#lockNote').classList.add('on'); $('#mineBtn').style.display='none';
}
/* 初始化：进来即对话，默认「需求」 */
(async()=>{ await loadProjects(); await loadCustomersList(); setType('intake',true);
  try{ const me=(await (await fetch('/api/me')).json()).me; if(me){ ME=me; $('#meName').textContent=me.name||me.username||'现场'; if(me.link) applyLinkLock(me); } }catch(e){}
  if(!(ME&&ME.link)) await applyLock();
  resetChat();
  try{ const h=await (await fetch('/api/model-config')).json(); if(!h.configured) toast('提示：管理员尚未配置模型 API，AI 暂不能对话'); }catch(e){}
})();
</script>
