<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>批次管理 · 收件 intake</title>
<link rel="stylesheet" href="/vendor/tabler/tabler-icons.min.css">
<link rel="stylesheet" href="/assets/theme.css">
<script src="/assets/ui.js" defer></script>
<script src="/assets/shell.js" defer></script>
<style>
  /* 批次卡列表（原型无对应类，页面内自带；用 theme token） */
  .blist{display:flex;flex-direction:column;gap:10px}
  .bcard{display:flex;align-items:center;gap:14px;border:1px solid var(--color-border);border-radius:10px;padding:12px 14px;cursor:pointer;transition:border-color .12s,box-shadow .12s}
  .bcard:hover{border-color:var(--color-primary);box-shadow:0 1px 6px rgba(15,39,68,.08)}
  .bcard .bno{font-weight:700;font-family:var(--font-num,monospace);font-size:15px;min-width:64px}
  .bcard .bmeta{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .bcard .bprod{font-weight:600}
  .bcard .bsub{font-size:12.5px;color:var(--color-text-tertiary);display:flex;gap:12px;flex-wrap:wrap}
  .bcard .bsub .mono{font-family:var(--font-num,monospace)}
  .bempty{font-size:13px;color:var(--color-text-tertiary);padding:40px 10px;text-align:center;border:1px dashed var(--color-border-strong);border-radius:10px}
  .bempty .ti{font-size:34px;display:block;margin-bottom:8px;color:var(--color-text-tertiary)}
  /* 详情抽屉：子系统分组 */
  .dsec{margin-bottom:16px}
  .dsec .dlab{font-size:12px;color:var(--color-text-tertiary);margin-bottom:6px}
  .dsec .dval{font-size:14px}
  .hospchips{display:flex;flex-wrap:wrap;gap:6px}
  .subgrp{border:1px solid var(--color-border);border-radius:8px;margin-bottom:10px;overflow:hidden}
  .subgrp .subgrp-hd{background:var(--color-bg-subtle,#f5f7fa);padding:8px 12px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px}
  .subgrp .subgrp-hd .cnt{font-weight:400;color:var(--color-text-tertiary);font-size:12px}
  .subgrp .trow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--color-border)}
  .subgrp .trow .tid{font-family:var(--font-num,monospace);font-size:12px;color:var(--color-text-tertiary);min-width:96px}
  .subgrp .trow .ttitle{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .subgrp .trow .tmeta{font-size:12px;color:var(--color-text-tertiary);display:flex;gap:8px;flex-shrink:0}
  /* 定档建批小 modal */
  #arrangeBox .form-group{margin-bottom:0}
  /* 详情抽屉动作条 + 上传包表单 + 包信息 */
  .dactions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .relbox{border:1px solid var(--color-border);border-radius:8px;padding:12px 14px;margin-bottom:16px;background:var(--color-bg-subtle,#f5f7fa)}
  .relbox .rlhd{font-weight:600;font-size:13px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
  .relbox .form-group{margin-bottom:10px}
  .relbox .form-group:last-of-type{margin-bottom:0}
  .relbox label{font-size:12px;color:var(--color-text-tertiary);display:block;margin-bottom:4px}
  .relbox input,.relbox textarea{width:100%;box-sizing:border-box;padding:7px 10px;border:1px solid var(--color-border);border-radius:6px;font-size:13px;font-family:inherit}
  .relbox textarea{min-height:56px;resize:vertical}
  .pkgbox .prow{display:flex;gap:8px;font-size:13px;padding:5px 0;border-top:1px solid var(--color-border)}
  .pkgbox .prow:first-child{border-top:none}
  .pkgbox .prow .k{color:var(--color-text-tertiary);min-width:72px;flex-shrink:0}
  .pkgbox .prow .v{flex:1;min-width:0;word-break:break-all}
  .pkgbox .prow .v.mono{font-family:var(--font-num,monospace)}
  /* 实施任务清单（更新包清单 · 全局完成态） */
  .itbox{border:1px solid var(--color-border);border-radius:8px;padding:12px 14px;margin-bottom:16px}
  .itbox .rlhd{font-weight:600;font-size:13px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
  .itbox .it-item{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:7px 0;border-top:1px solid var(--color-border)}
  .itbox .it-item:first-of-type{border-top:none}
  .itbox .it-chk{flex:0 0 auto;margin-top:2px;color:#1E8E4E}
  .itbox .it-chk.off{color:var(--color-text-tertiary)}
  .itbox .it-main{flex:1;min-width:0}
  .itbox .it-title{font-weight:600;word-break:break-word}
  .itbox .it-title.done{text-decoration:line-through;color:var(--color-text-tertiary)}
  .itbox .it-desc{color:var(--color-text-tertiary);font-size:12px;margin-top:2px;white-space:pre-wrap;word-break:break-word}
  .itbox .it-meta{color:var(--color-text-tertiary);font-size:11.5px;margin-top:2px}
  .itbox .it-empty{color:var(--color-text-tertiary);font-size:13px;padding:6px 0}
  .itbox .it-edit-row{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
  .itbox .it-edit-row input{box-sizing:border-box;padding:7px 10px;border:1px solid var(--color-border);border-radius:6px;font-size:13px;font-family:inherit}
  /* 部署清单审核区（发包时人审草稿 → 快照冻结进批次） */
  .dpbox{border:1px solid var(--color-border);border-radius:8px;padding:12px 14px;margin-bottom:16px;background:var(--color-bg-subtle,#f5f7fa)}
  .dpbox .rlhd{font-weight:600;font-size:13px;margin-bottom:10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .dpbox .dp-badge{font-size:11.5px;padding:1px 8px;border-radius:10px;font-weight:600}
  .dpbox .dp-badge.ok{background:#E6F4EA;color:#1E8E4E}
  .dpbox .dp-badge.no{background:#FDECEC;color:#C0392B}
  .dpbox .dp-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .dpbox .dp-toolbar label{font-size:12px;color:var(--color-text-tertiary)}
  .dpbox .dp-toolbar input.dp-from{width:120px;box-sizing:border-box;padding:6px 9px;border:1px solid var(--color-border);border-radius:6px;font-size:13px;font-family:inherit}
  .dpbox .dp-toolbar .dp-to{font-family:var(--font-num,monospace);font-weight:600}
  .dpbox .dp-sec-hd{font-size:12.5px;font-weight:600;color:var(--color-text-secondary);margin:12px 0 6px;display:flex;align-items:center;gap:6px}
  .dpbox .dp-item{border:1px solid var(--color-border);border-radius:7px;padding:8px 10px;margin-bottom:8px;background:var(--color-bg,#fff)}
  .dpbox .dp-item .dp-row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .dpbox .dp-item .dp-row:last-child{margin-bottom:0}
  .dpbox .dp-item input,.dpbox .dp-item textarea{box-sizing:border-box;padding:6px 9px;border:1px solid var(--color-border);border-radius:6px;font-size:13px;font-family:inherit;width:100%}
  .dpbox .dp-item textarea{resize:vertical}
  .dpbox .dp-item textarea.dp-sql{min-height:64px;font-family:var(--font-num,monospace);font-size:12px}
  .dpbox .dp-item .dp-del{flex:0 0 auto;color:#C0392B;cursor:pointer;font-size:16px;line-height:1}
  .dpbox .dp-item .dp-ver{font-size:11px;color:var(--color-text-tertiary);font-family:var(--font-num,monospace);flex:0 0 auto}
  .dpbox .dp-add{font-size:12.5px;color:var(--color-primary);cursor:pointer;display:inline-flex;align-items:center;gap:4px;margin-top:2px}
  .dpbox .dp-empty{font-size:12.5px;color:var(--color-text-tertiary);padding:6px 0}
  .dpbox .dp-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;padding-top:10px;border-top:1px solid var(--color-border)}
</style>
</head>
<body data-shell="admin" data-nav="batches" data-breadcrumb="交付管理 > 批次管理" data-content-layout="list">

<div class="card">
  <div class="filter-bar" style="display:flex;align-items:center;gap:12px;padding:10px 14px">
    <div class="filter-grid" style="flex:1">
      <div class="filter-field"><label>产品</label><select class="select" id="fProduct"><option value="">全部产品</option></select></div>
      <div class="filter-field"><label>状态</label><select class="select" id="fStatus"><option value="">全部状态</option><option value="开发中">开发中</option><option value="可下载">可下载</option><option value="已交付">已交付</option></select></div>
    </div>
    <button class="btn btn-primary" id="btnArrange"><i class="ti ti-package"></i>定档建批</button>
  </div>
</div>

<div class="card" style="flex:1;min-height:0;display:flex;flex-direction:column">
  <div class="table-wrap" style="flex:1;min-height:0;padding:4px">
    <div class="blist" id="blist"></div>
  </div>
  <div class="pagination">
    <div class="page-info">共 <b id="totalCount">0</b> 个批次</div>
  </div>
</div>

<!-- 定档建批 modal（选产品 → 确认建批） -->
<div class="drawer-mask" id="drawerMask"></div>
<div class="modal" id="arrangeModal">
  <div class="modal-header"><div class="modal-title">定档建批</div><span class="modal-close" data-close-modal="arrangeModal"><i class="ti ti-x"></i></span></div>
  <div class="modal-body" id="arrangeBox">
    <div class="form-group">
      <label>选择产品 <span class="req">*</span></label>
      <select class="select" id="arProduct"><option value="">请选择产品</option></select>
    </div>
    <div class="form-group" style="margin-top:12px">
      <label>排期时间（计划交付）</label>
      <input type="date" id="arSchedule" style="width:100%;box-sizing:border-box;padding:7px 10px;border:1px solid var(--color-border);border-radius:6px;font-size:13px;font-family:inherit">
      <div class="text-tertiary" style="font-size:12px;margin-top:4px">可留空，之后在批次详情里补设/修改。</div>
    </div>
    <div class="form-group" style="margin-top:12px">
      <label style="display:flex;align-items:center;gap:8px">纳入工单
        <span class="text-tertiary" style="font-weight:400;font-size:12px">（该产品「已落实且未归批」工单，默认全选，可勾选子集）</span>
        <span style="margin-left:auto;font-weight:400"><a href="javascript:;" id="arSelAll" style="font-size:12px;color:var(--color-primary)">全选</a> · <a href="javascript:;" id="arSelNone" style="font-size:12px;color:var(--color-primary)">全不选</a></span>
      </label>
      <div id="arCandBox" style="max-height:240px;overflow:auto;border:1px solid var(--color-border);border-radius:6px;padding:4px"><div class="text-tertiary" style="padding:12px;font-size:12.5px">请先选择产品。</div></div>
    </div>
    <div class="text-tertiary" style="font-size:12.5px;margin-top:10px;line-height:1.6">
      勾选的工单（跨全部医院合并）归成一个新批次，内部按子系统分组，初始状态「开发中」。
    </div>
  </div>
  <div class="modal-footer"><button class="btn" data-close-modal="arrangeModal">取消</button><button class="btn btn-primary" id="btnArrangeOk"><i class="ti ti-check"></i>确认建批</button></div>
</div>

<!-- 批次详情抽屉 -->
<div class="drawer wide" id="detailDrawer">
  <div class="drawer-header">
    <div><div class="drawer-title" id="dTitle">批次详情</div><div class="drawer-subtitle" id="dSubtitle"></div></div>
    <span class="modal-close" data-close-drawer="detailDrawer"><i class="ti ti-x"></i></span>
  </div>
  <div class="drawer-body" id="detailBody"></div>
  <div class="drawer-footer"><button class="btn" data-close-drawer="detailDrawer">关闭</button></div>
</div>

<!-- 添加工单 modal（批次侧从「已立项+未归批」勾选加入） -->
<div class="modal" id="addTicketModal">
  <div class="modal-header"><div class="modal-title" id="addTkTitle">添加工单</div><span class="modal-close" data-close-modal="addTicketModal"><i class="ti ti-x"></i></span></div>
  <div class="modal-body">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <span class="text-tertiary" style="font-size:12px">勾选该产品「已立项且未归批」工单加入本批次。</span>
      <span style="margin-left:auto"><a href="javascript:;" id="addSelAll" style="font-size:12px;color:var(--color-primary)">全选</a> · <a href="javascript:;" id="addSelNone" style="font-size:12px;color:var(--color-primary)">全不选</a></span>
    </div>
    <div id="addTkBox" style="max-height:300px;overflow:auto;border:1px solid var(--color-border);border-radius:6px;padding:4px"></div>
  </div>
  <div class="modal-footer"><button class="btn" data-close-modal="addTicketModal">取消</button><button class="btn btn-primary" id="btnAddTkOk"><i class="ti ti-check"></i>加入批次</button></div>
</div>

<!-- 开发清单预览 modal（json 结构化预览） -->
<div class="modal wide" id="previewModal">
  <div class="modal-header"><div class="modal-title" id="previewTitle">清单预览</div><span class="modal-close" data-close-modal="previewModal"><i class="ti ti-x"></i></span></div>
  <div class="modal-body" id="previewBody" style="max-height:60vh;overflow:auto"></div>
  <div class="modal-footer"><button class="btn" data-close-modal="previewModal">关闭</button></div>
</div>

<div class="toast-container" id="toastHost"></div>

<script>
const $=s=>document.querySelector(s);
const $$=s=>Array.prototype.slice.call(document.querySelectorAll(s));
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* —— 时间统一格式 yyyy-MM-dd HH:mm（全局规范⑫；兼容 ISO 串 / 时间戳 / 已格式化值），空值 — —— */
function fmtTime(v){
  if(v==null||v==='') return '—';
  // 已是「yyyy-MM-dd HH:mm」或「yyyy-MM-dd」直接用（nowStamp 产出）
  if(typeof v==='string' && /^\d{4}-\d{2}-\d{2}( \d{2}:\d{2})?$/.test(v)) return v;
  let d;
  if(typeof v==='number') d=new Date(v);
  else { const s=String(v); d=new Date(/^\d+$/.test(s)?Number(s):s); }
  if(isNaN(d.getTime())) return String(v);
  const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* —— toast（部署 shell.js 无 toast，自实现；用 theme.css .toast-container/.toast.show） —— */
function toast(msg,type){ const host=$('#toastHost'); if(!host)return; const el=document.createElement('div'); el.className='toast '+(type||''); const ic=type==='success'?'ti-circle-check':type==='error'?'ti-alert-circle':type==='warning'?'ti-alert-triangle':'ti-info-circle'; el.innerHTML=`<i class="ti ${ic}"></i><span>${esc(msg)}</span>`; host.appendChild(el); requestAnimationFrame(()=>el.classList.add('show')); setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(),300); },2400); }

/* —— 抽屉/modal 开关（部署 shell.js 无 UI.openDrawer，自实现；用 theme.css .drawer.open/.modal.open/.drawer-mask.open） —— */
function openDrawer(id){ const d=document.getElementById(id); if(!d)return; $('#drawerMask').classList.add('open'); d.classList.add('open'); }
function closeDrawer(id){ const d=document.getElementById(id); if(d)d.classList.remove('open'); if(!document.querySelector('.drawer.open,.modal.open')) $('#drawerMask').classList.remove('open'); }
function openModal(id){ const m=document.getElementById(id); if(!m)return; $('#drawerMask').classList.add('open'); m.classList.add('open'); }
function closeModal(id){ const m=document.getElementById(id); if(m)m.classList.remove('open'); if(!document.querySelector('.drawer.open,.modal.open')) $('#drawerMask').classList.remove('open'); }
document.addEventListener('click', e=>{
  const cd=e.target.closest('[data-close-drawer]'); if(cd){ closeDrawer(cd.getAttribute('data-close-drawer')); return; }
  const cm=e.target.closest('[data-close-modal]'); if(cm){ closeModal(cm.getAttribute('data-close-modal')); }
});
$('#drawerMask').addEventListener('click',()=>{ $$('.drawer.open,.modal.open').forEach(d=>d.classList.remove('open')); $('#drawerMask').classList.remove('open'); });

let PROJECTS=[], BATCHES=[], CUR_BATCH=null;
const STATUS_TAG={ '开发中':'tag-primary', '可下载':'tag-info', '已交付':'tag-success' };
const pname=id=>{ const p=PROJECTS.find(x=>x.id===id); return p?p.name:id; };

/* ---------- 列表 ---------- */
function render(){
  const box=$('#blist');
  box.innerHTML = BATCHES.length ? BATCHES.map(b=>{
    const tag=STATUS_TAG[b.status]||'tag-gray';
    return `<div class="bcard" data-id="${esc(b.id)}">
      <div class="bno">${esc(b.id)}</div>
      <div class="bmeta">
        <div class="bprod">${esc(b.productName||pname(b.product))} <span class="tag ${tag}">${esc(b.status||'—')}</span></div>
        <div class="bsub">
          <span><i class="ti ti-ticket"></i> ${esc(b.ticketCount||0)} 个工单</span>
          <span class="mono"><i class="ti ti-clock"></i> ${esc(fmtTime(b.createdAt))}</span>
          <span class="mono"><i class="ti ti-calendar-event"></i> 排期 ${b.scheduleDate?esc(b.scheduleDate):'<span class="text-tertiary">未排期</span>'}</span>
          ${b.pkgVersion?`<span><i class="ti ti-clipboard-check"></i> 部署清单 ${b.deployReviewed?`<span style="color:#1E8E4E;font-weight:600">已审核·${(b.deployTaskCount||0)+(b.deploySqlCount||0)}项</span>`:'<span style="color:#C0392B;font-weight:600">未审核</span>'}</span>`:''}
        </div>
      </div>
      <i class="ti ti-chevron-right text-tertiary"></i>
    </div>`;
  }).join('') : `<div class="bempty"><i class="ti ti-package"></i>还没有批次。点右上角「定档建批」，对某产品把已落实工单归成一批。</div>`;
  $('#totalCount').textContent=BATCHES.length;
}

/* ---------- 详情抽屉 ---------- */
async function openDetail(id){
  $('#dTitle').textContent='批次 '+id;
  $('#dSubtitle').textContent='';
  $('#detailBody').innerHTML='<div class="text-tertiary" style="padding:20px;text-align:center">加载中…</div>';
  openDrawer('detailDrawer');
  let r;
  try{ r=await (await fetch('/api/batch-detail?id='+encodeURIComponent(id))).json(); }catch(e){ $('#detailBody').innerHTML='<div class="bempty">加载失败</div>'; return; }
  if(!r||!r.item){ $('#detailBody').innerHTML='<div class="bempty">批次不存在</div>'; return; }
  const b=r.item, groups=r.groups||[], hosps=r.hospitals||[];
  CUR_BATCH=b;
  const tag=STATUS_TAG[b.status]||'tag-gray';
  $('#dSubtitle').textContent=(b.productName||pname(b.product))+' · '+(b.status||'');
  const hospHtml = hosps.length ? hosps.map(h=>`<span class="tag tag-gray">${esc(h)}</span>`).join('') : '<span class="text-tertiary">—</span>';
  const canEditMembers = b.status==='开发中';   // 仅开发中批次可增减成员（可下载/已交付锁定）
  const groupHtml = groups.length ? groups.map(g=>{
    const rows=(g.tickets||[]).map(t=>`<div class="trow">
      <span class="tid">${esc(t.id)}</span>
      <span class="ttitle">${esc(t.title||'（无标题）')}</span>
      <span class="tmeta">
        <span class="tag ${t.type==='bug'?'tag-danger':'tag-primary'}">${t.type==='bug'?'BUG':'需求'}</span>
        ${t.site?`<span>${esc(t.site)}</span>`:''}
        ${t.version?`<span class="mono">${esc(t.version)}</span>`:''}
        ${canEditMembers?`<button class="btn btn-sm tkrm" data-tid="${esc(t.id)}" title="移出批次"><i class="ti ti-x"></i>移出</button>`:''}
      </span>
    </div>`).join('');
    return `<div class="subgrp">
      <div class="subgrp-hd"><i class="ti ti-stack-2"></i>${esc(g.subsystemLabel||g.subsystem||'（未指定子系统）')} <span class="cnt">${(g.tickets||[]).length} 单</span></div>
      ${rows}
    </div>`;
  }).join('') : '<div class="bempty">该批次暂无覆盖工单</div>';
  // 动作条：导出开发清单（md 下载）+ 预览（json）——全状态可用
  const actionsHtml=`<div class="dactions">
    <a class="btn btn-primary" href="/api/batch-checklist?id=${encodeURIComponent(b.id)}&format=md" target="_blank" rel="noopener"><i class="ti ti-file-download"></i>导出开发清单</a>
    <button class="btn" id="btnChecklistPreview" data-bid="${esc(b.id)}"><i class="ti ti-eye"></i>预览清单</button>
  </div>`;
  // 上传包表单（开发中）/ 包信息（可下载/已交付）
  let relHtml='';
  if(b.status==='开发中'){
    relHtml=`<div class="relbox">
      <div class="rlhd"><i class="ti ti-package-export"></i>上传包 · 转「可下载」</div>
      <div class="form-group"><label>包版本 <span class="req">*</span></label><input id="relPkgVersion" placeholder="如 v2.7.1" maxlength="60"></div>
      <div class="form-group"><label>包地址 <span class="req">*</span></label><input id="relArtifactUrl" placeholder="https://.../pkg.zip" maxlength="500"></div>

/* ---------- 批次成员编辑：移出 / 添加工单（2026-08-06 BP-01） ---------- */
async function removeTicketFromBatch(b, tid){
  if(!tid) return;
  if(!confirm('确认把工单 '+tid+' 移出批次 '+b.id+'？')) return;
  try{
    const r=await (await fetch('/api/ticket-set-batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project:b.product,id:tid,batch:''})})).json();
    if(!r.ok){ toast(r.error||'移出失败','warning'); return; }
    toast('已移出工单 '+tid,'success');
    await openDetail(b.id);   // 刷新详情
    await loadBatches();      // 刷新列表工单数
  }catch(e){ toast('移出失败：'+e.message,'error'); }
}
let ADD_CANDS=[];
async function openAddTickets(b){
  $('#addTkTitle').textContent='添加工单 → 批次 '+b.id;
  $('#addTkBox').innerHTML='<div class="text-tertiary" style="padding:12px;font-size:12.5px">加载中…</div>';
  $('#btnAddTkOk').dataset.bid=b.id; $('#btnAddTkOk').dataset.pid=b.product;
  openModal('addTicketModal');
  try{ ADD_CANDS=(await (await fetch('/api/batch-candidates?product='+encodeURIComponent(b.product))).json()).items||[]; }catch(e){ ADD_CANDS=[]; }
  const box=$('#addTkBox');
  box.innerHTML=ADD_CANDS.length ? ADD_CANDS.map(t=>candRow(t,false)).join('')
    : '<div class="text-tertiary" style="padding:12px;font-size:12.5px">该产品当前无「已立项且未归批」工单可添加。</div>';
}
async function doAddTickets(){
  const btn=$('#btnAddTkOk'); const bid=btn.dataset.bid;
  const ticketIds=$$('#addTkBox .arCk:checked').map(c=>c.value);
  if(!ticketIds.length){ toast('请至少勾选一条工单','warning'); return; }
  btn.disabled=true;
  try{
    const r=await (await fetch('/api/batch-add-tickets',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({batchId:bid,ticketIds})})).json();
    if(!r.ok){ toast(r.error||'添加失败','warning'); return; }
    const added=(r.added||[]).length, skipped=(r.skipped||[]).length;
    toast('已添加 '+added+' 单'+(skipped?('，跳过 '+skipped+' 单'):''),added?'success':'warning');
    closeModal('addTicketModal');
    await openDetail(bid);
    await loadBatches();
  }catch(e){ toast('添加失败：'+e.message,'error'); }
  finally{ btn.disabled=false; }
}

/* ================= 部署清单审核（发包时人审草稿 → 快照冻结进 batch.deployPlan）================= */
//   模型：代码 docs/deploy/<版本>.json = 草稿源（@HEAD）；发包时拉 (起始版本, 目标版本] 累积草稿 → 运营增删改 → 存快照；实施读快照。
let DP_STATE={ batchId:'', to:'', tasks:[], sql:[] };   // 当前编辑中的部署清单（内存）
function loadDeployBox(b){
  const box=$('#deployBox'); if(!box) return;
  DP_STATE={ batchId:b.id, to:b.pkgVersion||'', tasks:[], sql:[] };
  const reviewed=!!b.deployReviewed;
  box.innerHTML=`<div class="dpbox">
    <div class="rlhd"><i class="ti ti-clipboard-check"></i>部署清单审核
      <span class="dp-badge ${reviewed?'ok':'no'}" id="dpBadge">${reviewed?('已审核 · 任务 '+(b.deployTaskCount||0)+' · SQL '+(b.deploySqlCount||0)):'未审核'}</span>
      <span style="font-size:11.5px;color:var(--color-text-tertiary);font-weight:400">发包时从代码拉草稿 → 人工确认 → 冻结进批次（实施照此执行）</span>
    </div>
    <div class="dp-toolbar">
      <label>起始版本</label><input class="dp-from" id="dpFrom" placeholder="现场版本(可空=从头)" maxlength="60">
      <label>目标版本</label><span class="dp-to">${esc(b.pkgVersion||'')}</span>
      <button class="btn btn-sm" id="dpBtnDraft"><i class="ti ti-cloud-download"></i>从代码拉取草稿</button>
    </div>
    <div id="dpEditArea"><div class="dp-empty">点「从代码拉取草稿」按 起始→目标 版本区间累积代码清单；或直接手动添加。</div></div>
    <div class="dp-actions">
      <button class="btn btn-sm" id="dpAddTask"><i class="ti ti-plus"></i>加任务</button>
      <button class="btn btn-sm" id="dpAddSql"><i class="ti ti-plus"></i>加 SQL</button>
      <button class="btn btn-sm btn-primary" id="dpSave"><i class="ti ti-device-floppy"></i>保存部署清单快照</button>
    </div>
  </div>`;
  // 拉已存快照回显（reviewed）或初始化 from
  $('#dpBtnDraft').addEventListener('click',()=>fetchDeployDraft());
  $('#dpAddTask').addEventListener('click',()=>{ DP_STATE.tasks.push({id:'',title:'',desc:'',version:''}); renderDeployEdit(); });
  $('#dpAddSql').addEventListener('click',()=>{ DP_STATE.sql.push({id:'',title:'',desc:'',content:'',version:''}); renderDeployEdit(); });
  $('#dpSave').addEventListener('click',()=>saveDeployPlan());
  // 初次进入：拉一次（含 saved 回显 + from 默认）
  fetchDeployDraft(true);
}
async function fetchDeployDraft(initial){
  const from=($('#dpFrom')?.value||'').trim();
  const btn=$('#dpBtnDraft'); if(btn&&!initial) btn.disabled=true;
  try{
    const qs='?batchId='+encodeURIComponent(DP_STATE.batchId)+'&from='+encodeURIComponent(from);
    const r=await (await fetch('/api/batch-deploy-draft'+qs)).json();
    if(!r.ok){ if(!initial) toast(r.error||'拉取草稿失败','warning'); return; }
    if(initial && r.saved && r.saved.reviewedAt){
      // 已审核：回显已存快照（可再改再存）
      DP_STATE.tasks=(r.saved.tasks||[]).map(t=>({id:t.id||'',title:t.title||'',desc:t.desc||'',version:''}));
      DP_STATE.sql=(r.saved.sql||[]).map(s=>({id:s.id||'',title:s.title||'',desc:s.desc||'',content:s.content||'',version:''}));
      if($('#dpFrom')) $('#dpFrom').value=r.saved.from||'';
    } else {
      // 未审核 或 手动点拉取：用代码草稿覆盖当前编辑区
      const d=r.draft||{tasks:[],sql:[]};
      DP_STATE.tasks=(d.tasks||[]).map(t=>({id:t.id||'',title:t.title||'',desc:t.desc||'',version:t.version||''}));
      DP_STATE.sql=(d.sql||[]).map(s=>({id:s.id||'',title:s.title||'',desc:s.desc||'',content:s.content||'',version:s.version||''}));
      if(!initial){
        const vc=(d.versions||[]).length;
        toast('已拉取 '+DP_STATE.tasks.length+' 任务 · '+DP_STATE.sql.length+' SQL（覆盖 '+vc+' 个版本）','success');
      }
    }
    renderDeployEdit();
  }catch(e){ if(!initial) toast('拉取草稿失败：'+e.message,'error'); }
  finally{ if(btn) btn.disabled=false; }
}
function renderDeployEdit(){
  const area=$('#dpEditArea'); if(!area) return;
  const taskHtml=DP_STATE.tasks.length? DP_STATE.tasks.map((t,i)=>`<div class="dp-item" data-tk="${i}">
    <div class="dp-row"><input class="dp-t-title" data-i="${i}" placeholder="任务标题(必填)" maxlength="120" value="${esc(t.title||'')}">${t.version?`<span class="dp-ver">v${esc(t.version)}</span>`:''}<i class="ti ti-trash dp-del" data-del-task="${i}"></i></div>
    <div class="dp-row"><input class="dp-t-desc" data-i="${i}" placeholder="说明(可空)" maxlength="2000" value="${esc(t.desc||'')}"></div>
  </div>`).join('') : '<div class="dp-empty">暂无任务</div>';
  const sqlHtml=DP_STATE.sql.length? DP_STATE.sql.map((s,i)=>`<div class="dp-item" data-sq="${i}">
    <div class="dp-row"><input class="dp-s-title" data-i="${i}" placeholder="SQL 标题/文件名" maxlength="200" value="${esc(s.title||'')}">${s.version?`<span class="dp-ver">v${esc(s.version)}</span>`:''}<i class="ti ti-trash dp-del" data-del-sql="${i}"></i></div>
    <div class="dp-row"><input class="dp-s-desc" data-i="${i}" placeholder="说明(可空)" maxlength="200" value="${esc(s.desc||'')}"></div>
    <div class="dp-row"><textarea class="dp-sql dp-s-content" data-i="${i}" placeholder="-- SQL 正文（发包时冻结进批次）">${esc(s.content||'')}</textarea></div>
  </div>`).join('') : '<div class="dp-empty">暂无 SQL</div>';
  area.innerHTML=`<div class="dp-sec-hd"><i class="ti ti-list-check"></i>实施任务（${DP_STATE.tasks.length}）</div>${taskHtml}
    <div class="dp-sec-hd"><i class="ti ti-database"></i>升级 SQL（${DP_STATE.sql.length}）</div>${sqlHtml}`;
  // 绑输入回写内存（用事件委托，避免逐个 addEventListener）
  area.querySelectorAll('.dp-t-title').forEach(el=>el.addEventListener('input',e=>{ DP_STATE.tasks[+e.target.dataset.i].title=e.target.value; }));
  area.querySelectorAll('.dp-t-desc').forEach(el=>el.addEventListener('input',e=>{ DP_STATE.tasks[+e.target.dataset.i].desc=e.target.value; }));
  area.querySelectorAll('.dp-s-title').forEach(el=>el.addEventListener('input',e=>{ DP_STATE.sql[+e.target.dataset.i].title=e.target.value; }));
  area.querySelectorAll('.dp-s-desc').forEach(el=>el.addEventListener('input',e=>{ DP_STATE.sql[+e.target.dataset.i].desc=e.target.value; }));
  area.querySelectorAll('.dp-s-content').forEach(el=>el.addEventListener('input',e=>{ DP_STATE.sql[+e.target.dataset.i].content=e.target.value; }));
  area.querySelectorAll('[data-del-task]').forEach(el=>el.addEventListener('click',e=>{ DP_STATE.tasks.splice(+e.target.dataset.delTask,1); renderDeployEdit(); }));
  area.querySelectorAll('[data-del-sql]').forEach(el=>el.addEventListener('click',e=>{ DP_STATE.sql.splice(+e.target.dataset.delSql,1); renderDeployEdit(); }));
}
async function saveDeployPlan(){
  const from=($('#dpFrom')?.value||'').trim();
  // 校验：任务标题非空（提交前提示）
  const badTask=DP_STATE.tasks.find(t=>!(t.title||'').trim());
  if(badTask){ toast('有任务标题为空，请填写或删除','warning'); return; }
  const tasks=DP_STATE.tasks.filter(t=>(t.title||'').trim()).map(t=>({id:t.id||'',title:(t.title||'').trim(),desc:(t.desc||'').trim()}));
  const sql=DP_STATE.sql.filter(s=>(s.content||'').trim()||(s.title||'').trim()).map(s=>({id:s.id||'',title:(s.title||'').trim(),desc:(s.desc||'').trim(),content:s.content||''}));
  const btn=$('#dpSave'); if(btn) btn.disabled=true;
  try{
    const r=await (await fetch('/api/batch-deploy-save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({batchId:DP_STATE.batchId,from,tasks,sql})})).json();
    if(!r.ok){ toast(r.error||'保存失败','warning'); return; }
    toast('部署清单已审核并快照（任务 '+(r.deployPlan?.tasks?.length||0)+' · SQL '+(r.deployPlan?.sql?.length||0)+'）','success');
    await loadBatches();
    await openDetail(DP_STATE.batchId);   // 刷新详情（徽标转「已审核」）
  }catch(e){ toast('保存失败：'+e.message,'error'); }
  finally{ if(btn) btn.disabled=false; }
}

    const groups=r.groups||[];
    const body=groups.length ? groups.map(g=>{
      const items=(g.items||[]).map(it=>`<div class="trow" style="flex-direction:column;align-items:stretch;gap:4px">
        <div style="display:flex;gap:8px;align-items:center"><span class="tag ${it.type==='bug'?'tag-danger':'tag-primary'}">${it.type==='bug'?'BUG':'需求'}</span><b>${esc(it.title||'（无标题）')}</b><span class="tid">${esc(it.ticketId)}</span></div>
        <div style="font-size:12px;color:var(--color-text-tertiary)">医院：${esc((it.hospitals||[]).join('、')||'—')}　版本：${esc(it.siteVersion||'—')}　截图：${(it.media||[]).length} 张</div>
        <div style="font-size:12.5px;white-space:pre-wrap">描述：${esc(it.desc||'（无）')}</div>
        <div style="font-size:12.5px;white-space:pre-wrap">验收：${esc(it.accept||'（无）')}</div>
      </div>`).join('');
      return `<div class="subgrp"><div class="subgrp-hd"><i class="ti ti-stack-2"></i>${esc(g.subsystemLabel||g.subsystem||'（未指定）')} <span class="cnt">${(g.items||[]).length} 单</span></div>${items}</div>`;
    }).join('') : '<div class="bempty">该批次暂无覆盖工单</div>';
    $('#previewBody').innerHTML=body;
    $('#previewTitle').textContent='清单预览 · '+id;
    openModal('previewModal');
  }catch(e){ toast('预览失败：'+e.message,'error'); }
}

/* ---------- 定档建批 ---------- */
function fillProductOptions(){
  const opts='<option value="">全部产品</option>'+PROJECTS.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');
  $('#fProduct').innerHTML=opts;
  $('#arProduct').innerHTML='<option value="">请选择产品</option>'+PROJECTS.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');
}
/* 定档 modal 候选工单清单（该产品「已立项+未归批」，默认全选） */
let AR_CANDS=[];
async function loadArrangeCandidates(pid){
  const box=$('#arCandBox');
  if(!pid){ AR_CANDS=[]; box.innerHTML='<div class="text-tertiary" style="padding:12px;font-size:12.5px">请先选择产品。</div>'; return; }
  box.innerHTML='<div class="text-tertiary" style="padding:12px;font-size:12.5px">加载中…</div>';
  try{ AR_CANDS=(await (await fetch('/api/batch-candidates?product='+encodeURIComponent(pid))).json()).items||[]; }catch(e){ AR_CANDS=[]; }
  if(!AR_CANDS.length){ box.innerHTML='<div class="text-tertiary" style="padding:12px;font-size:12.5px">该产品当前无已落实待分批工单。</div>'; return; }
  box.innerHTML=AR_CANDS.map(t=>candRow(t,true)).join('');
}
function candRow(t,checked){
  return `<label class="candrow" style="display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:12.5px">
    <input type="checkbox" class="arCk" value="${esc(t.id)}"${checked?' checked':''} style="flex:0 0 auto">
    <span class="tag ${t.type==='bug'?'tag-danger':'tag-primary'}" style="flex:0 0 auto">${t.type==='bug'?'BUG':'需求'}</span>
    <span class="mono text-tertiary" style="flex:0 0 auto">${esc(t.id)}</span>
    <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.title||'（无标题）')}</span>
    ${t.site?`<span class="text-tertiary" style="flex:0 0 auto">${esc(t.site)}</span>`:''}
  </label>`;
}
async function doArrange(){
  // 读被 ui.js .ui-sel-* 增强的 select 值：用 select.类名（这里按 id 取，直接命中原生 select，无 wrapper 干扰）
  const pid=$('#arProduct').value;
  if(!pid){ toast('请先选择产品','warning'); return; }
  if(!AR_CANDS.length){ toast('该产品当前无已落实待分批工单','warning'); return; }
  const ticketIds=$$('#arCandBox .arCk:checked').map(c=>c.value);
  if(!ticketIds.length){ toast('请至少勾选一条工单','warning'); return; }
  const scheduleDate=($('#arSchedule')?.value||'').trim();   // <input type=date> 原生值即 yyyy-MM-dd（或空）
  $('#btnArrangeOk').disabled=true;
  try{
    const r=await (await fetch('/api/batch-arrange',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({product:pid,scheduleDate,ticketIds})})).json();
    if(!r.ok){ toast(r.error||'建批失败','warning'); return; }
    toast('已建批 '+r.item.id+'（'+(r.item.ticketCount||0)+' 单）','success');
    closeModal('arrangeModal');
    await loadBatches();
  }catch(e){ toast('建批失败：'+e.message,'error'); }
  finally{ $('#btnArrangeOk').disabled=false; }
}

/* ---------- 加载 ---------- */
async function loadBatches(){
  const fp=$('#fProduct').value, fst=$('#fStatus').value;
  const qs=[]; if(fp) qs.push('product='+encodeURIComponent(fp)); if(fst) qs.push('status='+encodeURIComponent(fst));
  try{ BATCHES=(await (await fetch('/api/batches'+(qs.length?'?'+qs.join('&'):''))).json()).items||[]; }catch(e){ BATCHES=[]; }
  render();
}

/* ---------- 事件绑定 ---------- */
$('#btnArrange').addEventListener('click',()=>{ $('#arProduct').value=''; $('#arProduct').dispatchEvent(new Event('change',{bubbles:true})); if($('#arSchedule')) $('#arSchedule').value=''; AR_CANDS=[]; $('#arCandBox').innerHTML='<div class="text-tertiary" style="padding:12px;font-size:12.5px">请先选择产品。</div>'; openModal('arrangeModal'); });
$('#arProduct').addEventListener('change',()=>loadArrangeCandidates($('#arProduct').value));
$('#arSelAll').addEventListener('click',()=>$$('#arCandBox .arCk').forEach(c=>c.checked=true));
$('#arSelNone').addEventListener('click',()=>$$('#arCandBox .arCk').forEach(c=>c.checked=false));
$('#btnArrangeOk').addEventListener('click',doArrange);
$('#addSelAll').addEventListener('click',()=>$$('#addTkBox .arCk').forEach(c=>c.checked=true));
$('#addSelNone').addEventListener('click',()=>$$('#addTkBox .arCk').forEach(c=>c.checked=false));
$('#btnAddTkOk').addEventListener('click',doAddTickets);
$('#blist').addEventListener('click',e=>{ const c=e.target.closest('[data-id]'); if(c) openDetail(c.dataset.id); });
$('#detailBody').addEventListener('click',e=>{ const p=e.target.closest('#btnChecklistPreview'); if(p) previewChecklist(p.getAttribute('data-bid')); });
/* 选择型即选即查 */
['fProduct','fStatus'].forEach(id=>$('#'+id).addEventListener('change',loadBatches));

async function load(){
  try{ PROJECTS=(await (await fetch('/api/projects')).json()).projects||[]; }catch(e){}
  fillProductOptions();
  await loadBatches();
}
load();
</script>
</body>
</html>
